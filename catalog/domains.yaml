# Canonical domain and use-case taxonomy.
# Packages live at resources/<domain>/<use-case>/<resource-id>/ and the
# use-case directory must appear in the manifest's use_cases list.
domains:
  - id: software-development
    name: Software Development
    symbol: chevron.left.forwardslash.chevron.right
    use_cases:
      - repository-analysis
      - code-review
      - debugging
      - api-development
      - architecture-assessment
      - database-optimization
      - test-generation
      - documentation
      - refactoring
      - devops
      - dependency-management
