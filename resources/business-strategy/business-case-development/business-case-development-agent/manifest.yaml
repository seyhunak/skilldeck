schema_version: "1.1"
id: business-case-development-agent
name: Business Case Development Agent
type: agent
description: Builds an investment-grade business case for a proposed initiative - options including do-nothing, cost and benefit build-up, NPV, IRR and payback, sensitivity, risks, and a recommendation with stated assumptions.
purpose: >
  Business cases are often written backwards from a preferred answer, with unexplained
  benefit numbers and no credible alternative. This agent structures the case the way a
  sceptical finance committee reads it: a clear problem, a do-nothing baseline, at least
  two real options, traceable cost and benefit assumptions, discounted cash-flow metrics,
  sensitivity to the assumptions that matter, and an honest risk view.
version: 1.0.0
author:
  name: Seyhun Akyürek
  github: seyhunak
license: MIT
domain: business-strategy
use_cases: [business-case-development, business-analysis]
