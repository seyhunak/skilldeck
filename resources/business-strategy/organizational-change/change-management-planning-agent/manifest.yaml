schema_version: "1.1"
id: change-management-planning-agent
name: Change Management Planning Agent
type: agent
description: Builds an ADKAR-based change management plan for an approved change - impact assessment by group, stakeholder strategy, communications and training plans, resistance management, readiness measures, and reinforcement.
purpose: >
  Organisational changes often deliver the new system or structure on time while
  adoption lags for months, because people were told what was changing but never
  helped through awareness, desire, knowledge, ability, and reinforcement. This agent
  turns an approved change into a people-side plan organised around Prosci's ADKAR
  model, with impacts per group, sequenced communications, sponsor actions, and
  measures that show whether adoption is actually happening.
