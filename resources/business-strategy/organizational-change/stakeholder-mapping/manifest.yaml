schema_version: "1.1"
id: stakeholder-mapping
name: Stakeholder Mapping
type: skill
description: Identifies stakeholders for an initiative, positions them on power/interest and current-versus-needed support, and turns the map into an engagement strategy with owners, messages, and cadence.
purpose: >
  Initiatives stall when an influential stakeholder is discovered late or engaged with
  the wrong message. This skill produces a structured stakeholder register and
  power/interest grid, adds a current-versus-desired commitment assessment, and derives
  a practical engagement plan, so effort goes to the people whose support the
  initiative actually depends on.
