schema_version: "1.1"
id: raci-matrix-design
name: RACI Matrix Design
type: skill
description: Designs a RACI matrix that assigns exactly one Accountable owner per decision or deliverable, keeps Consulted lists lean, and detects anti-patterns such as multiple A's, missing R's, and roles overloaded with responsibility.
purpose: >
  Unclear accountability shows up as stalled decisions, duplicated work, and
  finger-pointing. A RACI matrix fixes this only if it is built around meaningful
  decisions and deliverables and checked for common failures. This skill structures the
  activity list, assigns roles with explicit rules, and audits the result row by row
  and column by column so the matrix clarifies ownership instead of documenting
  confusion.
