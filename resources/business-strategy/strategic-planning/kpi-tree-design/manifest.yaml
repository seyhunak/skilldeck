schema_version: "1.1"
id: kpi-tree-design
name: KPI Tree Design
type: skill
description: Decomposes a north-star or top-level business metric into a tree of mathematically linked input drivers, separates controllable levers from outcomes, and assigns owners and definitions to each node.
purpose: >
  Teams track dozens of metrics without knowing how they connect to the outcome that
  matters, so effort goes to whatever is easiest to move. This skill builds a driver
  tree whose branches combine by explicit arithmetic (sums, products, ratios), ending
  in leading indicators that specific teams can influence, so planning, target setting,
  and variance diagnosis all share one coherent model.
