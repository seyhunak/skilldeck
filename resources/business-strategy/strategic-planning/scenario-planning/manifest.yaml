schema_version: "1.1"
id: scenario-planning
name: Scenario Planning
type: skill
description: Builds a 2x2 scenario set from the two most critical, most uncertain external drivers, writes distinct plausible futures, tests strategy robustness against each, and defines signposts that show which future is unfolding.
purpose: >
  Plans built on one forecast break when the world turns out differently. This skill
  applies the intuitive-logics scenario method associated with Shell and Global
  Business Network: separate predetermined trends from critical uncertainties, build
  four contrasting futures, and use them to test strategies and set early-warning
  signposts, rather than to predict which future will occur.
