schema_version: "1.1"
id: strategy-options-evaluation-prompt
name: Strategy Options Evaluation
type: prompt
description: Compares strategic options with a transparent weighted-criteria matrix, evidence for each score, must-have screens, sensitivity to weights, and an explicit view of what would change the ranking.
purpose: >
  Option debates often stall on opinion or hidden criteria. This prompt structures them as a multi-criteria evaluation: agreed criteria and weights, knock-out screens, evidence-backed scores, a sensitivity test showing whether the winner is robust to reasonable weight changes, and a clear statement of assumptions, so leaders discuss the drivers of the choice rather than the arithmetic.
