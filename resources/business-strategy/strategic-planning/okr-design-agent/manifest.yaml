schema_version: "1.1"
id: okr-design-agent
name: OKR Design Agent
type: agent
description: Drafts and critiques Objectives and Key Results - outcome-based key results with baselines and targets, vertical and horizontal alignment, measurability checks, and anti-pattern detection such as task-list KRs and sandbagging.
purpose: >
  OKRs regularly degrade into renamed to-do lists, vanity metrics, or targets nobody can
  measure. This agent writes OKR sets from strategy and context, or audits existing ones,
  testing each key result for outcome orientation, measurability, baseline, ambition
  level, and alignment, so teams commit to a small number of results that matter.
