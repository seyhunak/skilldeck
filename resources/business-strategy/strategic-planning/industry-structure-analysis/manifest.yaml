schema_version: "1.1"
id: industry-structure-analysis
name: Industry Structure Analysis
type: skill
description: Applies Porter's Five Forces to a clearly defined industry with cited evidence for each force, rates force strength, explains the resulting profitability, and identifies strategic implications and likely shifts.
purpose: >
  Five Forces analyses are frequently a box-ticking exercise of unsupported adjectives.
  This skill defines the industry boundary first, assesses each force with specific
  structural evidence and observable indicators, connects the forces to where profit
  is captured, and translates the analysis into positioning choices and signposts of
  structural change, while labelling evidence quality throughout.
