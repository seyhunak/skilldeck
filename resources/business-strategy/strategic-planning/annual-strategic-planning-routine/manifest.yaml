schema_version: "1.1"
id: annual-strategic-planning-routine
name: Annual Strategic Planning Routine
type: routine
description: A human-led annual planning cycle - strategy refresh from evidence, diagnosis and choices, scenario stress test, priorities and resource allocation, targets and OKRs, budget alignment, and communication - with gates for leadership approval.
purpose: >
  Annual planning frequently collapses into a budgeting exercise that rolls last
  year's plan forward. This routine sequences the cycle so that strategy comes before
  numbers: a fact base and diagnosis refresh, explicit strategic choices tested against
  scenarios, a short list of funded priorities, then targets, OKRs, and budgets that
  follow from those choices, with clear decision gates and owners.
