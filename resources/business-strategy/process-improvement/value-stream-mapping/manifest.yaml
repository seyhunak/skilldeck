schema_version: "1.1"
id: value-stream-mapping
name: Value Stream Mapping
type: skill
description: Maps a value stream from request to delivery - process time, wait time, %C&A, lead time, and waste - then designs a future state with flow improvements and an implementation plan.
purpose: >
  Most delay in business processes sits in queues and handoffs between steps, not in
  the work itself, and it is invisible on ordinary flowcharts. Value stream mapping
  makes it visible by measuring each step's process time, waiting time, and quality,
  so teams can calculate flow efficiency, locate waste, and design a future state that
  shortens lead time without guessing.
