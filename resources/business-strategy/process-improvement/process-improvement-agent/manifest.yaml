schema_version: "1.1"
id: process-improvement-agent
name: Process Improvement Agent
type: agent
description: Runs a Lean / Six Sigma DMAIC analysis on one business process - charter, baseline metrics, process map, root-cause analysis, improvement design, and control plan - using data the user supplies.
purpose: >
  Process fixes often jump straight to a favourite solution without measuring the
  baseline or confirming the cause, so improvements do not stick. This agent guides a
  single process through Define, Measure, Analyze, Improve, and Control, choosing Lean
  tools for flow and waste problems and Six Sigma tools for variation and defect
  problems, and it ends with a control plan so gains are sustained.
version: 1.0.0
author:
  name: Seyhun Akyürek
  github: seyhunak
license: MIT
domain: business-strategy
use_cases: [process-improvement, business-analysis]
tags: [dmaic, lean, six-sigma, root-cause-analysis, process-capability, control-plan]
