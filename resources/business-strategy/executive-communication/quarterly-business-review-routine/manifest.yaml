schema_version: "1.1"
id: quarterly-business-review-routine
name: Quarterly Business Review Routine
type: routine
description: A repeatable, human-run quarterly business review - gather and reconcile metrics, analyse performance against plan and OKRs, prepare a pre-read, run a decision-focused review meeting, and track actions into the next quarter.
purpose: >
  Quarterly reviews often become long slide presentations that report activity but
  produce few decisions. This routine standardises preparation, a reconciled metric
  pack, variance and OKR analysis, a short pre-read circulated in advance, a meeting
  agenda centred on decisions and re-prioritisation, and an action log reviewed at the
  next cycle, so each quarter's review changes what the business does next.
