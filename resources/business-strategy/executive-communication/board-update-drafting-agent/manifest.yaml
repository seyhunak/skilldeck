schema_version: "1.1"
id: board-update-drafting-agent
name: Board Update Drafting Agent
type: agent
description: Drafts a board or investor update from metrics, financials, and leadership notes - headline narrative, KPI table with variance explanations, wins and concerns stated plainly, decisions and asks - with every number traced to its source.
purpose: >
  Board and investor updates take leaders hours to assemble and often bury bad news,
  mix metric definitions between periods, or omit the specific help needed. This agent
  turns raw metrics and notes into a concise, candid update that leads with the
  headline, explains variances against plan, separates decisions requested from
  information, and flags any figure it could not reconcile.
