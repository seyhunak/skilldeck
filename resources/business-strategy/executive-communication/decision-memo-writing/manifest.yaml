schema_version: "1.1"
id: decision-memo-writing
name: Decision Memo Writing
type: skill
description: Writes a decision memo that states the decision needed, real options with trade-offs, a clear recommendation, reversibility (one-way vs two-way door), risks, and dissenting views, so an approver can decide in one read.
purpose: >
  Decision documents often bury the ask, present one real option, or omit the
  arguments against the recommendation. This skill produces a structured, narrative
  memo that leads with the decision and deadline, compares genuine alternatives against
  stated criteria, calibrates process to reversibility, and records dissent and
  assumptions so the decision can later be reviewed on the quality of reasoning, not
  only the outcome.
