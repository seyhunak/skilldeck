schema_version: "1.1"
id: executive-summary-prompt
name: Executive Summary
type: prompt
description: Condenses a long report, proposal, or analysis into a one-page, decision-ready executive summary that leads with the answer, the ask, and the evidence that matters.
purpose: >
  Senior readers decide from the first page. This prompt turns a long document into a summary organised by the pyramid principle - answer first, then supporting points, then the decision or action required - while preserving numbers exactly, flagging gaps, and never adding claims that are not in the source.
