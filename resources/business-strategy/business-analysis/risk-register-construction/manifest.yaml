schema_version: "1.1"
id: risk-register-construction
name: Risk Register Construction
type: skill
description: Builds a risk register with cause-event-consequence risk statements, defined likelihood and impact scales, inherent and residual ratings, named owners, response strategies, mitigations with dates, and review triggers.
purpose: >
  Risk registers are often lists of vague worries ("resourcing", "delays") with scores
  nobody can reproduce. This skill writes risks as specific cause-event-consequence
  statements, scores them on agreed scales, separates inherent from residual exposure,
  assigns one owner and a concrete response per risk, and sets triggers for review, so
  the register drives action instead of decorating a status report.
