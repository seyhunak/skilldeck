schema_version: "1.1"
id: unit-economics-analysis
name: Unit Economics Analysis
type: skill
description: Calculates and interprets unit economics - CAC, contribution margin, churn-based LTV, LTV:CAC, and CAC payback - by segment and channel, with consistent definitions and warnings about common calculation errors.
purpose: >
  Unit economics decide whether growth creates or destroys value, yet the numbers are
  often computed inconsistently: revenue instead of margin in LTV, blended CAC that
  hides expensive channels, or churn rates from immature cohorts. This skill applies
  explicit definitions and formulas, segments the results, and states the assumptions
  that drive them so decisions about spend and pricing rest on sound arithmetic.
