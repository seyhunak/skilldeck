schema_version: "1.1"
id: business-model-canvas-prompt
name: Business Model Canvas
type: prompt
description: Generates a Business Model Canvas across all nine building blocks from a business description, then critiques it for internal consistency, riskiest assumptions, and economic viability, with tests to validate the weakest blocks.
purpose: >
  A Business Model Canvas is easy to fill with generic phrases and hard to use as a
  thinking tool. This prompt drafts the nine blocks specifically for one segment and
  value proposition, separates evidence from assumptions, checks that the blocks fit
  together and that revenue can cover the cost structure, and ranks the riskiest
  assumptions with concrete validation tests.
