schema_version: "1.1"
id: loan-covenant-analysis
name: Loan Covenant Analysis
type: skill
description: "Extracts financial covenants and defined terms from a facility agreement, recomputes compliance on contractual definitions, measures headroom and EBITDA cushion, projects step-downs, and flags definition risks."
purpose: >
  Covenant compliance depends on the agreement's definitions, add-back caps, and test
  mechanics rather than textbook ratios. This skill walks from reported figures to
  covenant figures clause by clause, measures headroom and break points, and surfaces
  definition risks for lenders, borrowers, and counsel.
