  - {platform: claude-desktop, level: copy_paste, resource_types: [agent]}
  - {platform: generic, level: generic_export, resource_types: [agent]}
dependencies: [financial-ratio-analysis, loan-covenant-analysis]
related: [working-capital-analysis, credit-application-review-routine, financial-statement-analysis-agent, cash-flow-forecasting-agent]
featured: false
safety:
