schema_version: "1.1"
id: credit-risk-analysis-agent
name: Credit Risk Analysis Agent
type: agent
description: "Assesses a commercial borrower using the 5 Cs, spread ratios, CFADS and DSCR, collateral, covenants, and stress cases, and drafts a credit memo with an indicative risk rating for a credit officer to challenge."
purpose: >
  Credit memos take analysts days and often bury their assumptions. This agent drafts a
  structured memo grounded in repayment capacity and downside cases, shows its workings,
  and proposes an indicative rating with migration triggers, leaving approval, pricing,
  and policy exceptions to authorized credit officers.
version: 1.0.0
author:
  name: Seyhun Akyürek
  github: seyhunak
license: MIT
domain: finance-banking
