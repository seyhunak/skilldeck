schema_version: "1.1"
id: credit-application-review-routine
name: Credit Application Review Routine
type: routine
description: "Takes a commercial credit application from intake through policy pre-screen, KYC confirmation, spreading, capacity and stress, structure and covenants, rating, memo, and approval with a documented trail."
purpose: >
  Inconsistent credit files create approval risk and audit findings. This routine
  standardizes the path from application to committee-ready package, defines when to stop
  or seek exceptions, and keeps approval, pricing, and exceptions with authorized credit
  officers while AI assists with drafting analysis.
