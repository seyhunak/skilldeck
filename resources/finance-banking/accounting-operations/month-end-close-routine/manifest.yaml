schema_version: "1.1"
id: month-end-close-routine
name: Month-End Close Routine
type: routine
description: "A day-by-day month-end close workflow: cut-off, bank and balance sheet reconciliations, accruals, intercompany, journal review, flux analysis, reporting pack, sign-off, and retrospective."
purpose: >
  Close quality depends on doing the same checks in the same order every month with clear
  ownership. This routine sequences the close from pre-close to retrospective, defines
  escalation points for unreconciled differences and late items, and keeps posting and
  sign-off with authorized people while AI drafts workpapers.
