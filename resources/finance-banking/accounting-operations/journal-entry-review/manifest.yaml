schema_version: "1.1"
id: journal-entry-review
name: Journal Entry Review
type: skill
description: "Tests journal entry populations for completeness and risk criteria (post-close, off-hours, round amounts, odd account pairs, self-approval, quick reversals), scores and selects entries, and tracks support requests."
purpose: >
  Management override of controls tends to appear in manual journals. This skill applies
  documented, weighted risk criteria to a complete journal population, selects entries for
  follow-up with a stated rationale, and summarizes control observations, so reviewers
  focus on what matters without implying wrongdoing.
