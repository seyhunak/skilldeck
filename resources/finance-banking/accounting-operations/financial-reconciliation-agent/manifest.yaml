schema_version: "1.1"
id: financial-reconciliation-agent
name: Financial Reconciliation Agent
type: agent
description: "Reconciles bank, PSP, subledger, and intercompany records to the ledger using staged matching rules, classifies and ages breaks, investigates root causes, and drafts unposted adjustments for accountant approval."
purpose: >
  Unreconciled differences hide errors and sometimes fraud, and plugs make them worse.
  This agent proves balances, matches in transparent passes from strict to loose,
  classifies every break with an age and a cause hypothesis, and prepares a reviewer-ready
  workpaper with proposed, never posted, adjustments.
