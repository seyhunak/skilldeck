schema_version: "1.1"
id: banking-operations-analyst-agent
name: Banking Operations Analyst
type: agent
description: "Diagnoses payments and banking operations: exception and repair rates, STP, queue aging, SLA and cut-off breaches, root causes, and control gaps, returning a quantified diagnostic and prioritized improvement plan."
purpose: >
  Payments operations teams fight exception queues and cut-off misses without a clear view
  of root causes. This agent quantifies volumes, aging, and SLA performance from case
  data, finds the few exception categories that drive most work, reviews control design,
  and proposes KPIs and fixes for managers to validate.
