schema_version: "1.1"
id: kyc-document-review
name: KYC Document Review
type: skill
description: "Checks a customer due diligence file against a KYC checklist: identity and address evidence, entity documents, beneficial ownership chains, source of funds, screening evidence, and risk-rating rationale, producing a gap list."
purpose: >
  Common KYC failures are mundane and preventable: expired IDs, ownership chains that stop
  early, missing EDD for high-risk ratings. This skill checks files systematically against
  the institution's policy, computes indirect ownership, and produces a severity-ranked
  gap list for a human KYC analyst, without approving customers.
