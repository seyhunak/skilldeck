schema_version: "1.1"
id: three-statement-model-review
name: Three-Statement Model Review
type: skill
description: "Audits the mechanics of an integrated financial model: balance and cash checks, roll-forwards, working capital signs, debt and revolver logic, circularity, hard-codes, and formula consistency, with a severity-ranked log."
purpose: >
  Models that feed lending, valuation, and budget decisions often contain silent errors
  and balancing plugs. This skill applies a model-audit checklist and mechanical stress
  tests so integrity issues are found and ranked, with cell references and fixes, before
  anyone relies on the outputs.
