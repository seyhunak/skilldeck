schema_version: "1.1"
id: dcf-valuation
name: DCF Valuation
type: skill
description: "Builds or reviews a DCF: unlevered FCF, CAPM-based WACC with re-levered beta, Gordon and exit-multiple terminal values with cross-checks, EV-to-equity bridge, and WACC/growth sensitivity tables."
purpose: >
  A DCF is a transparent statement of assumptions, not a precise answer. This skill
  produces a valuation range with every input sourced or labelled, cross-checks terminal
  value methods, catches common errors such as growth above WACC or double-counted leases,
  and shows which assumptions move value most.
