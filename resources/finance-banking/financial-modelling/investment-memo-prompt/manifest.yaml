schema_version: "1.1"
id: investment-memo-prompt
name: Investment Memo
type: prompt
description: "Structures diligence and valuation material into a committee memo with falsifiable thesis, bear case, valuation sensitivity, risk register, diligence gaps, and cited facts, without recommending a trade."
purpose: >
  Investment committees decide better when memos separate evidence from advocacy. This
  prompt organizes supplied material into a rigorous memo with testable thesis statements,
  an equally specific bear case, cited facts, and explicit diligence gaps, and frames the
  output as deliberation material rather than advice.
