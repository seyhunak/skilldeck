schema_version: "1.1"
id: financial-statement-analysis-agent
name: Financial Statement Analysis Agent
type: agent
description: "Reads income statement, balance sheet, and cash flow together: ties them out, assesses quality of earnings and cash conversion, screens for accounting red flags, and returns a cited brief with follow-up questions."
purpose: >
  Decisions about lending to, investing in, or depending on a company often rest on a
  quick skim of its accounts. This agent performs a disciplined three-statement read: tie-
  outs first, then trends, accruals, working capital, financing, and a red-flag screen,
  with every figure cited so a qualified reviewer can verify the brief before relying on
  it.
