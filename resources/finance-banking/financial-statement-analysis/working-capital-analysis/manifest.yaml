schema_version: "1.1"
id: working-capital-analysis
name: Working Capital Analysis
type: skill
description: "Calculates DSO, DIO, DPO, cash conversion cycle, and NWC as % of revenue with stated conventions, values each day of change in cash, separates seasonality from trend, and flags window-dressing and earnings-quality signals."
purpose: >
  Working capital is where profit turns into cash, or does not. This skill measures days
  tied up in receivables and inventory net of supplier credit, translates day changes into
  cash amounts, and separates real improvement from seasonality, factoring, or period-end
  timing.
