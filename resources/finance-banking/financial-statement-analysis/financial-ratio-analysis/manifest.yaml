schema_version: "1.1"
id: financial-ratio-analysis
name: Financial Ratio Analysis
type: skill
description: "Computes liquidity, leverage, coverage, profitability, efficiency, and cash ratios with stated formulas and averaging rules, DuPont-decomposes ROE, and interprets trends and peer gaps with caveats."
purpose: >
  Ratios are only comparable when their definitions are explicit. This skill standardizes
  formulas, averaging, and lease treatment so any agent produces reproducible ratio packs,
  then guides interpretation through trends, DuPont decomposition, and anomaly flags
  without claiming universal benchmarks.
