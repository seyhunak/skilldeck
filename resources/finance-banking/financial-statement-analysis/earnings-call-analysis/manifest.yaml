schema_version: "1.1"
id: earnings-call-analysis
name: Earnings Call Analysis
type: skill
description: "Extracts guidance changes, KPI disclosure shifts, tone and hedging changes, and Q&A themes from an earnings call transcript, cross-checks claims against reported numbers, and cites every point."
purpose: >
  Earnings calls reveal what management emphasizes and what analysts doubt, but
  transcripts are long. This skill produces a cited brief of guidance changes, dropped or
  new KPIs, claims versus numbers, tone shifts, and Q&A deflections so readers see what
  changed since last quarter.
