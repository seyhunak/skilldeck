schema_version: "1.1"
id: financial-results-commentary-prompt
name: Financial Results Commentary
type: prompt
description: "Turns a results table and validated drivers into management commentary with a headline, line-by-line what/why/persistence explanations, outlook, and a checklist of items to confirm before distribution."
purpose: >
  Finance teams rewrite results commentary every month under deadline. This prompt
  converts validated numbers and drivers into concise, consistent commentary for
  executives, boards, or lenders, refuses to invent causes, and lists every placeholder
  and computed figure for confirmation before release.
