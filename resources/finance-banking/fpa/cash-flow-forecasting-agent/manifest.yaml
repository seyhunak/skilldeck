schema_version: "1.1"
id: cash-flow-forecasting-agent
name: Cash Flow Forecasting Agent
type: agent
description: "Builds and rolls a 13-week direct cash flow forecast from AR/AP, payroll, tax, and debt schedules, with liquidity headroom, covenant checks, scenarios, prior-week variance analysis, and an assumptions register."
purpose: >
  Liquidity problems are visible weeks ahead in a good short-term cash forecast. This
  agent builds a 13-week receipts-and-disbursements forecast from collection behaviour and
  committed obligations, tracks accuracy against actuals, runs downside scenarios, and
  flags the weeks where cash or headroom falls short so management can decide in time.
