schema_version: "1.1"
id: budget-variance-analysis-agent
name: Budget Variance Analysis Agent
type: agent
description: "Explains actual-vs-budget or forecast results with an EBITDA bridge, FX isolation, price/volume/mix and rate/efficiency decompositions, driver classification, and draft commentary with forecast implications."
purpose: >
  Variance commentary too often says costs were higher because costs were higher. This
  agent decomposes variances mathematically, reconciles the bridge to reported totals,
  classifies each driver as timing, one-off, or run-rate with evidence, and drafts
  commentary and reforecast implications for FP&A to review.
