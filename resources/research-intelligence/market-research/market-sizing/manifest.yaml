schema_version: "1.1"
id: market-sizing
name: Market Sizing
type: skill
description: "Estimates TAM, SAM, and SOM with both top-down and bottom-up methods, explicit assumptions, sensitivity ranges, and a triangulation check. Use for business cases and market entry."
purpose: >
  Market-size numbers are routinely inflated by stacking an analyst headline figure on a
  vague percentage. This skill produces sizes a skeptical reviewer can audit: clearly
  bounded definitions, independent top-down and bottom-up builds, sourced inputs, ranges
  instead of point estimates, and a reconciliation of the gap between methods.
