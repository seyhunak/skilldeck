schema_version: "1.1"
id: customer-voice-research-agent
name: Customer Voice Research Agent
type: agent
description: "Mines reviews, forums, support tickets, and survey verbatims for customer needs, pains, and themes, with frequency, intensity, and representative quotes per theme."
purpose: >
  Customer feedback is scattered across app stores, review sites, community forums, and
  ticket queues, and teams tend to remember the loudest anecdote. This agent samples
  feedback deliberately, codes it into a transparent theme framework, quantifies
  frequency and intensity, flags sampling bias, and links every theme to traceable
  verbatims.
version: 1.0.0
author:
  name: Seyhun Akyürek
  github: seyhunak
license: MIT
domain: research-intelligence
use_cases: [market-research, competitor-analysis]
tags: [voice-of-customer, review-mining, thematic-analysis, customer-research, feedback-analysis]
