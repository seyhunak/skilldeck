schema_version: "1.1"
id: executive-research-memo-prompt
name: Executive Research Memo
type: prompt
description: "Turns research findings into a two-page executive memo: answer first, key evidence with confidence, implications, options, risks, and the decision requested."
purpose: >
  Good research often dies in a forty-page appendix. This prompt converts findings into
  a memo an executive can act on in five minutes: bottom line up front, the few facts
  that drive it with stated confidence, what it means, the options, and exactly what
  decision or input is needed.
