schema_version: "1.1"
id: trend-signal-detection
name: Trend Signal Detection
type: skill
description: "Separates weak signals from hype by scoring a trend on adoption indicators - usage, spend, hiring, standards, switching - versus attention indicators. Use for trend reports and radar inputs."
purpose: >
  Trend reports confuse attention with adoption: press coverage and funding rounds are
  counted as proof that customers are using something. This skill collects signals
  across independent indicator families, weights behavioural evidence above talk, places
  the trend on an adoption curve with stated uncertainty, and defines what to watch
  next.
