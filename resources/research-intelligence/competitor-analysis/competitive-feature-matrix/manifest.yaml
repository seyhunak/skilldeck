schema_version: "1.1"
id: competitive-feature-matrix
name: Competitive Feature Matrix
type: skill
description: "Builds a like-for-like capability grid across competitors with defined criteria, consistent scoring levels, and an evidence link and date for every cell. Use for product and sales comparisons."
purpose: >
  Feature comparisons are often check-mark tables that flatter the author's product.
  This skill defines comparable capabilities at the level buyers evaluate, scores them
  on explicit levels, attaches dated evidence to every cell, and flags unknowns, so the
  grid survives scrutiny from product, sales, and the competitors' own customers.
