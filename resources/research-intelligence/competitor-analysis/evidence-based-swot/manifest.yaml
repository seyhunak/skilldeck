schema_version: "1.1"
id: evidence-based-swot
name: Evidence-Based SWOT
type: skill
description: "Builds a SWOT in which every item cites evidence and is tested for the right quadrant, then derives TOWS strategic actions. Use when a SWOT must support a real decision."
purpose: >
  Most SWOTs are brainstormed lists of adjectives that cannot be acted on. This skill
  demands evidence per item, applies tests that keep internal and external factors in
  the right quadrants, ranks items by impact, and converts the grid into TOWS strategies
  so the analysis ends in options rather than a picture.
