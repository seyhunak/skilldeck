schema_version: "1.1"
id: competitor-battlecard-prompt
name: Competitor Battlecard
type: prompt
description: "Turns competitor research notes into a one-page sales battlecard: positioning, where we win and lose, landmines, objection handling, and proof points, each traceable to notes."
purpose: >
  Sales teams need a short, honest card they can use mid-call, not a forty-slide
  competitive deck. This prompt compresses research notes into a battlecard that is
  specific, fair to the competitor, traceable to evidence, and explicit about where the
  competitor is genuinely stronger.
