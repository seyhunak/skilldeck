schema_version: "1.1"
id: weekly-competitive-intelligence-routine
name: Weekly Competitive Intelligence Routine
type: routine
description: "A weekly, human-supervised sweep of competitor changes - pricing, product, hiring, messaging, customers - triaged by impact into a short digest with owners and actions."
purpose: >
  Competitive intelligence decays when it is done as an annual project. This routine
  standardises a time-boxed weekly sweep of a fixed watchlist, compares each source with
  last week's snapshot, triages changes by impact, and produces a digest that routes the
  few important moves to the people who must act.
