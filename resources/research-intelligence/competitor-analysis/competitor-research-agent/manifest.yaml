  - {platform: codex, level: file_export, resource_types: [agent]}
  - {platform: claude-desktop, level: copy_paste, resource_types: [agent]}
  - {platform: generic, level: generic_export, resource_types: [agent]}
dependencies: [competitive-feature-matrix, source-credibility-assessment, evidence-based-swot]
related: [competitor-battlecard-prompt, weekly-competitive-intelligence-routine, market-intelligence-agent, company-profile-research, product-marketing-positioning-agent]
featured: true
safety:
