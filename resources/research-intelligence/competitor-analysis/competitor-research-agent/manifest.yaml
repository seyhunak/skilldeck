schema_version: "1.1"
id: competitor-research-agent
name: Competitor Research Agent
type: agent
description: "Profiles named competitors from public evidence - product, pricing, positioning, go-to-market, and recent moves - with every claim source-cited and graded for reliability."
purpose: >
  Competitive decks are usually stitched together from memory, sales anecdotes, and
  stale screenshots. This agent builds a competitor dossier from dated, citable public
  evidence, grades each claim for reliability, separates fact from inference, and
  highlights the moves that change the decision in front of the team.
version: 1.0.0
author:
  name: Seyhun Akyürek
  github: seyhunak
license: MIT
domain: research-intelligence
use_cases: [competitor-analysis, market-research]
tags: [competitive-intelligence, competitor-profiling, pricing-research, positioning, evidence-grading]
created: "2026-11-09"
updated: "2026-11-09"
content:
