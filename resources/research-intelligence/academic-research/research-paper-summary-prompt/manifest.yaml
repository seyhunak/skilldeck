schema_version: "1.1"
id: research-paper-summary-prompt
name: Research Paper Summary
type: prompt
description: "Produces a structured critical summary of a research paper: question, method, findings with effect sizes, validity threats, what it does and does not show, and relevance to the reader."
purpose: >
  Abstracts oversell and readers rarely have time to judge methods. This prompt reads a
  paper the way a careful reviewer would, separating what the authors claim from what
  the design can support, and returns a summary that tells the reader how much to trust
  the result and whether it applies to their situation.
version: 1.0.0
author:
