schema_version: "1.1"
id: research-synthesis-matrix
name: Research Synthesis Matrix
type: skill
description: "Builds a source-by-theme matrix that records what each source says on each theme, then synthesises agreement, conflict, and gaps. Use when combining five or more sources."
purpose: >
  Summaries written source by source read like annotated bibliographies and hide where
  the evidence agrees or conflicts. The matrix forces cross-source comparison: each cell
  records a finding with its locator and strength, so the synthesis can state consensus,
  disagreement, and gaps honestly.
