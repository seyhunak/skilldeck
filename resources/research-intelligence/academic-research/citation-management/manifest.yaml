schema_version: "1.1"
id: citation-management
name: Citation Management
type: skill
description: "Keeps citations consistent and verifiable: style choice, quote versus paraphrase rules, pinpoint locators, DOIs, archived snapshots against link rot, and a citation audit. Use for any cited deliverable."
purpose: >
  A research deliverable is only as trustworthy as the reader's ability to check it.
  This skill standardises how sources are captured, quoted, paraphrased, formatted, and
  archived, and finishes with an audit that catches broken links, orphan references,
  misattributed quotes, and citations that do not support the sentence they sit on.
