  - {platform: codex, level: file_export, resource_types: [agent]}
  - {platform: claude-desktop, level: copy_paste, resource_types: [agent]}
  - {platform: generic, level: generic_export, resource_types: [agent]}
dependencies: [search-query-formulation, research-synthesis-matrix]
related: [technical-research-agent, technology-radar-agent, competitor-research-agent, due-diligence-research-agent, citation-management]
featured: false
safety:
