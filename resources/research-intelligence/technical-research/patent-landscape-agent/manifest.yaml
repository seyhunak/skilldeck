schema_version: "1.1"
id: patent-landscape-agent
name: Patent Landscape Agent
type: agent
description: "Maps patent activity in a technology field - assignees, filing trends, geographies, classification clusters, key families - from public patent databases. Research only, not legal advice."
purpose: >
  R&D and strategy teams want to know who is patenting what, where, and how fast before
  they invest. This agent builds a reproducible patent search, deduplicates by family,
  clusters by classification and technical theme, and charts the landscape with explicit
  caveats. It deliberately stops short of freedom-to-operate, validity, or infringement
  opinions, which only a registered patent attorney can give.
version: 1.0.0
author:
  name: Seyhun Akyürek
  github: seyhunak
license: MIT
domain: research-intelligence
use_cases: [technical-research, competitor-analysis]
tags: [patents, patent-landscape, intellectual-property, technology-scouting, legal]
created: "2026-11-09"
updated: "2026-11-09"
