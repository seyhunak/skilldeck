schema_version: "1.1"
id: technology-radar-agent
name: Technology Radar Agent
type: agent
description: "Assesses a set of technologies into adopt, trial, assess, and hold rings for a specific organization, with evidence, rationale, and movement since the last edition."
purpose: >
  Teams need a shared, defensible stance on which tools, platforms, and techniques to
  bet on. This agent runs a radar-style assessment scoped to the organization's context:
  it gathers maturity and adoption evidence for each blip, applies explicit ring
  criteria, writes the rationale a reviewer can challenge, and records what would move
  the blip next time.
