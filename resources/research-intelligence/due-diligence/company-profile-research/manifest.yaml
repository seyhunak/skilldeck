schema_version: "1.1"
id: company-profile-research
name: Company Profile Research
type: skill
description: "Builds a sourced company profile from public records - legal entity, ownership, leadership, products, financial signals, footprint, and news - with a source and date on every field."
purpose: >
  A reliable company profile is the base layer for sales, partnership, vendor, and
  diligence work, yet most profiles mix up legal entities and copy unsourced figures
  from aggregator sites. This skill pins down the exact entity first, pulls each field
  from the most authoritative public source available, and records gaps instead of
  filling them.
