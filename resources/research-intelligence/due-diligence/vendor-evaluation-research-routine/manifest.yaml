schema_version: "1.1"
id: vendor-evaluation-research-routine
name: Vendor Evaluation Research Routine
type: routine
description: "Takes a vendor shortlist to a documented recommendation: weighted criteria, evidence gathering, reference checks, risk screening, scoring, and a decision memo for approval."
purpose: >
  Vendor choices are frequently made on demo charisma and then regretted. This routine
  runs a fair, documented evaluation from shortlist to recommendation: criteria and
  weights fixed before demos, evidence collected the same way for every vendor,
  references and risk screens performed, and a scored recommendation that a budget owner
  can approve or challenge.
