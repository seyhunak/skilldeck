schema_version: "1.1"
id: expert-interview-guide
name: Expert Interview Guide
type: skill
description: "Designs expert-network interview guides: hypotheses to test, funnel-structured open questions, neutral wording, quantification probes, and compliance guardrails against confidential information."
purpose: >
  Expert calls are expensive and often wasted on leading questions that confirm what the
  buyer already believes. This skill produces a hypothesis-driven guide with neutral,
  sequenced questions, probes that turn opinions into numbers, and explicit compliance
  language so the interview stays clear of confidential and material non-public
  information.
