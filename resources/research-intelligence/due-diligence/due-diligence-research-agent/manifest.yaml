schema_version: "1.1"
id: due-diligence-research-agent
name: Due Diligence Research Agent
type: agent
description: "Researches a target company from public records - corporate structure, filings, financial signals, litigation, sanctions exposure, reputation - and returns a red-flag report. Not legal advice."
purpose: >
  Before signing a partner, supplier, or investment, teams need a disciplined first pass
  over public records. This agent verifies the entity, maps ownership and officers,
  reads filings for financial signals, searches litigation, regulatory actions,
  sanctions and adverse media, and returns a sourced red-flag register that tells
  counsel and finance exactly what to verify. It supports, never replaces, legal and
  financial review.
