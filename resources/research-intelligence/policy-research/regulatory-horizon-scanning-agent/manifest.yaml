schema_version: "1.1"
id: regulatory-horizon-scanning-agent
name: Regulatory Horizon Scanning Agent
type: agent
description: "Tracks proposed and upcoming regulation affecting a sector or product across jurisdictions, with stage, key dates, likely impact, and confidence, sourced to official texts."
purpose: >
  Regulation usually arrives with years of warning that organizations fail to notice
  until a deadline is close. This agent scans official legislative and regulatory
  sources for a defined scope, places each item on a stage-and-date timeline, summarises
  what it would require, rates relevance and likelihood, and hands compliance and legal
  teams a watchlist they can verify.
