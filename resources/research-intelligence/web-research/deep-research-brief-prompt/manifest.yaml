schema_version: "1.1"
id: deep-research-brief-prompt
name: Deep Research Brief
type: prompt
description: "Turns a vague research question into a scoped research plan: decision context, sub-questions, hypotheses, source strategy, evidence standards, and a stop rule."
purpose: >
  Research effort is wasted when nobody agrees what question is being answered or when
  to stop. This prompt converts a loose request into a one-page brief that a human
  researcher or a research agent can execute: the decision it serves, decomposed sub-
  questions, competing hypotheses, where to look, what evidence counts, and what done
  looks like.
