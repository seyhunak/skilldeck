schema_version: "1.1"
id: search-query-formulation
name: Search Query Formulation
type: skill
description: "Builds and iteratively refines search queries with Boolean logic, phrase search, site:, filetype:, date limits, and database-specific syntax. Use when a search returns noise or misses."
purpose: >
  Most research failures start with a single vague query. This skill turns a question
  into concept blocks, synonym sets, and engine-appropriate syntax, then refines through
  logged iterations so searches are precise, reproducible, and transparent about what
  was and was not covered.
