schema_version: "1.1"
id: source-credibility-assessment
name: Source Credibility Assessment
type: skill
description: "Evaluates a source's credibility with SIFT lateral reading and CRAAP criteria, checks provenance and bias, and assigns a reliability grade. Use before relying on any web source."
purpose: >
  Research quality is capped by source quality. This skill gives any agent a fast,
  repeatable way to decide how much weight a source deserves: lateral reading to learn
  who is behind it, CRAAP criteria for fitness, provenance tracing for recycled claims,
  and a two-axis grade that keeps source reliability separate from claim credibility.
