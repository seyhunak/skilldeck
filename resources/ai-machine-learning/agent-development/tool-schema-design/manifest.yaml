schema_version: "1.1"
id: tool-schema-design
name: Tool Schema Design
type: skill
description: "Designs function and tool definitions that LLMs call reliably: naming, granularity, descriptions, JSON Schema parameters, enums, error payloads, and side-effect and confirmation semantics."
purpose: >
  Most agent tool-calling failures trace back to ambiguous tool definitions: overlapping
  tools, vague descriptions, free-text parameters that should be enums, and errors the
  model cannot act on. This skill provides design rules and a review checklist for tool
  sets, plus a way to test that a model picks the right tool with the right arguments
  before the tools reach production.
