schema_version: "1.1"
id: agent-trace-debugging
name: Agent Trace Debugging
type: skill
description: "Reads agent transcripts and traces to find the first divergent step, classify the failure (planning, tool selection, arguments, observation handling, loop, context loss), and propose a targeted fix and regression case."
purpose: >
  Agent failures surface far from their cause: the bad final answer is usually the
  consequence of a wrong tool argument or a misread observation many steps earlier. This
  skill gives a disciplined way to annotate a trace, locate the first point of
  divergence, classify the root cause with a fixed taxonomy, and turn the finding into a
  specific change and a test that prevents recurrence.
