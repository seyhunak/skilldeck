schema_version: "1.1"
id: data-labeling-guidelines
name: Data Labeling Guidelines
type: skill
description: "Writes annotation guidelines with label definitions, decision rules, boundary examples, and an escalation path, then measures inter-annotator agreement and runs adjudication to improve the guidelines."
purpose: >
  Label noise from unclear guidelines caps model and eval quality, and teams often
  discover it only after thousands of items are labeled. This skill produces guidelines
  that resolve the hard cases explicitly, runs a pilot to measure agreement with Cohen's
  or Fleiss' kappa or Krippendorff's alpha, and uses disagreement analysis to revise
  rules before scaling up.
