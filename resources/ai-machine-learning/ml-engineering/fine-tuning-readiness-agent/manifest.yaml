schema_version: "1.1"
id: fine-tuning-readiness-agent
name: Fine-Tuning Readiness Agent
type: agent
description: "Decides whether a problem should be solved with prompting, retrieval, fine-tuning, or a combination, then specifies data requirements, a baseline-first eval plan, and go/no-go criteria for a fine-tuning project."
purpose: >
  Fine-tuning is often proposed to fix problems it cannot fix, such as missing or fast-changing knowledge, while problems
  it does fix - format consistency, style, narrow classification, latency at a smaller model - get solved with ever longer
  prompts. This agent diagnoses the gap, checks whether prompting and retrieval have been honestly exhausted, audits the
  available training data, and produces a readiness verdict with an evaluation plan.
