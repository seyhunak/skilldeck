schema_version: "1.1"
id: ml-experiment-review-agent
name: ML Experiment Review Agent
type: agent
description: "Reviews a machine learning experiment for design flaws: data leakage, split strategy, baselines, metric choice, tuning on test data, variance across seeds, and whether the claimed improvement is statistically supported."
purpose: >
  Many reported model improvements disappear on contact with production because of leakage, a weak baseline, a single
  lucky seed, or a test set that was quietly used for tuning. This agent reviews experiment code, configs, and results the
  way a rigorous peer reviewer would, ranks threats to validity by how much they could change the conclusion, and states
  what additional runs would make the claim trustworthy.
version: 1.0.0
author:
  name: Seyhun Akyürek
  github: seyhunak
license: MIT
domain: ai-machine-learning
