schema_version: "1.1"
id: model-card-writing
name: Model Card Writing
type: skill
description: "Writes model cards that document intended and out-of-scope use, training and evaluation data, disaggregated metrics, limitations, ethical considerations, and maintenance, grounded in evidence the team can cite."
purpose: >
  Model documentation is often a marketing paragraph or missing entirely, leaving
  downstream users to discover limitations in production. This skill follows the model
  card structure introduced by Mitchell et al. to produce documentation where every
  metric is traceable to an evaluation run, subgroup performance is reported rather than
  averaged away, and known failure modes are stated plainly.
