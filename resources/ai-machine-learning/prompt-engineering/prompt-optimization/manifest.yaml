schema_version: "1.1"
id: prompt-optimization
name: Prompt Optimization
type: skill
description: "Systematically improves a prompt against an eval set: baseline, failure analysis, one-change-at-a-time variants, ablations, held-out confirmation, and a change log, avoiding overfitting to a few examples."
purpose: >
  Prompt edits made by feel often fix one example and break three others. This skill
  treats a prompt as an artifact under test: establish a baseline on a fixed eval set,
  cluster failures, make targeted changes, ablate sections to learn what actually
  matters, and confirm on held-out data, so every shipped prompt change is backed by
  measured improvement.
