schema_version: "1.1"
id: structured-output-extraction
name: Structured Output Extraction
type: skill
description: "Gets reliable JSON from LLMs: schema design for extraction, enums and nullability, constrained decoding vs prompting, validation, bounded repair loops, and field-level accuracy measurement."
purpose: >
  Free-form model output breaks downstream parsers and quietly invents values for
  missing fields. This skill designs extraction schemas that make absence explicit,
  picks the strongest available enforcement mechanism, validates every response, repairs
  within a strict retry budget, and measures field-level accuracy, so structured outputs
  can feed real systems.
