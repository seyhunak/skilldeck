schema_version: "1.1"
id: context-window-management
name: Context Window Management
type: skill
description: "Manages what goes into an LLM context window: token budgets per section, priority ordering, truncation and compression, rolling summaries, and retrieval-based memory for long conversations and agent loops."
purpose: >
  Long conversations and agent loops degrade when context fills with stale tool output
  and redundant history: instructions get lost, costs rise, and requests fail at the
  limit. This skill allocates a budget per context section, defines eviction and
  summarization rules that preserve decisions and constraints, and tests that
  compression does not drop facts the task depends on.
