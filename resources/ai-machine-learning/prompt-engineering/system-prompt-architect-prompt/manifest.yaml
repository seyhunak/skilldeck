schema_version: "1.1"
id: system-prompt-architect-prompt
name: System Prompt Architect
type: prompt
description: Turns product requirements, user context, and policy constraints into a structured, testable production system prompt plus the open questions and eval cases it implies.
purpose: >
  Production system prompts are usually grown by accretion: a sentence added per
  incident until nobody knows which rule wins. This prompt drafts a system prompt
  from explicit requirements with a deliberate section order, resolved precedence
  between rules, explicit refusal and escalation behavior, and a list of behaviors
  that must be covered by evals before the prompt ships.
