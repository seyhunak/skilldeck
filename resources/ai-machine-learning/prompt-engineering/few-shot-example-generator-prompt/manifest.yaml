schema_version: "1.1"
id: few-shot-example-generator-prompt
name: Few-Shot Example Generator
type: prompt
description: Generates a small, deliberately diverse set of labeled few-shot examples for a classification or generation task, with a coverage matrix and label-balance check.
purpose: >
  Few-shot examples steer a model more strongly than most instructions, so a lopsided
  or repetitive set quietly biases outputs toward one label, length, or phrasing.
  This prompt produces examples planned against explicit diversity axes, balanced
  across labels, including hard near-boundary cases, and annotated with why each
  example earns its slot, so they can be reviewed before being placed in a prompt.
