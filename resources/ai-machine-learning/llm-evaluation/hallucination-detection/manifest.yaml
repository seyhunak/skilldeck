schema_version: "1.1"
id: hallucination-detection
name: Hallucination Detection
type: skill
description: "Detects unsupported content in LLM outputs by extracting atomic claims, matching each to source evidence, and labeling it supported, contradicted, or unverifiable, with aggregate faithfulness metrics."
purpose: >
  Fluent answers can contain fabricated numbers, citations, and entities that reviewers
  miss. This skill breaks an output into checkable atomic claims, verifies each against
  the provided sources or a trusted reference, and reports which claims fail and why,
  giving both a per-answer audit and a faithfulness rate that can be tracked over time.
