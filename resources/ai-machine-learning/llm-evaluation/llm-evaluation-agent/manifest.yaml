schema_version: "1.1"
id: llm-evaluation-agent
name: LLM Evaluation Agent
type: agent
description: "Designs and runs evaluation suites for LLM features: defines success criteria, builds or audits the test set, chooses metrics and graders, calibrates LLM judges against humans, and reports results with uncertainty."
purpose: >
  Teams ship prompt and model changes on the strength of a handful of spot checks. This agent turns a feature's
  requirements into a repeatable evaluation: a versioned case set, code-based and model-based graders, judge calibration
  against human labels, and a report that states effect sizes with confidence intervals, so a change is accepted or
  rejected on evidence rather than impressions.
version: 1.0.0
author:
  name: Seyhun Akyürek
  github: seyhunak
license: MIT
domain: ai-machine-learning
use_cases: [llm-evaluation]
tags: [llm-evaluation, evals, llm-as-judge, test-sets, metrics, calibration]
created: "2026-11-09"
updated: "2026-11-09"
content:
