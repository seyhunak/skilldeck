dependencies: [golden-dataset-construction, llm-judge-rubric-design]
related: [eval-test-case-generator-prompt, llm-output-critique-prompt, hallucination-detection, rag-evaluation-agent, model-upgrade-regression-routine, statistical-significance-testing]
