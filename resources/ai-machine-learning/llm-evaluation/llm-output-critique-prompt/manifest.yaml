schema_version: "1.1"
id: llm-output-critique-prompt
name: LLM Output Critique
type: prompt
description: Scores one LLM output against a supplied rubric, citing evidence from the output for every score, separating hard-rule failures from quality issues, and proposing targeted fixes.
purpose: >
  Ad-hoc "is this good?" reviews of model outputs are inconsistent between reviewers
  and between runs. This prompt is a pointwise judge template: it forces evidence
  before scores, scores each rubric dimension independently on anchored levels,
  treats hard-rule violations as gating failures rather than averaging them away,
  and returns machine-readable results suitable for logging alongside human labels.
