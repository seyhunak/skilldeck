schema_version: "1.1"
id: llm-judge-rubric-design
name: LLM Judge Rubric Design
type: skill
description: "Designs LLM-as-judge rubrics: criteria and anchored scales, pointwise vs pairwise setup, judge prompt structure, calibration against human labels, and controls for position, length, and self-preference bias."
purpose: >
  An uncalibrated LLM judge produces confident numbers that may not track what humans
  care about. This skill turns a vague quality goal into decomposed, anchored criteria,
  chooses the right comparison format, and requires agreement measurement against a
  human-labeled sample before the judge is trusted for decisions, so automated
  evaluation becomes a measured instrument rather than an opinion.
