schema_version: "1.1"
id: golden-dataset-construction
name: Golden Dataset Construction
type: skill
description: "Builds versioned evaluation datasets for LLM features: coverage matrix, sourcing from logs and synthesis, edge and adversarial cases, reference labeling, contamination checks, and dataset versioning."
purpose: >
  Evals are only as good as the cases they contain. Ad-hoc test sets over-represent easy
  happy paths, leak into prompts, and silently change between runs. This skill gives a
  structured method to define coverage, source and label cases, record provenance, split
  dev from held-out sets, and version the dataset so results stay comparable over time.
