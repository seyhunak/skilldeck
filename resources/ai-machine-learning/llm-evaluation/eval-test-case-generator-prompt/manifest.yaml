schema_version: "1.1"
id: eval-test-case-generator-prompt
name: Eval Test Case Generator
type: prompt
description: Generates a categorized batch of eval test cases for an LLM feature, covering core behavior, edge cases, and adversarial inputs, each with a checkable pass criterion.
purpose: >
  Most LLM eval sets are a few dozen happy-path examples written by the person who
  built the feature. This prompt expands a feature spec into a structured test plan
  across behavior categories, input perturbations, and adversarial probes, and writes
  every case with an explicit pass criterion and grading method, so the set can be
  run by code or an LLM judge rather than by eyeballing outputs.
