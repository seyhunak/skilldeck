schema_version: "1.1"
id: embedding-strategy-agent
name: Embedding Strategy Agent
type: agent
description: "Chooses an embedding approach for a retrieval system: model shortlist, dimensions and quantization, multilingual and domain fit, query versus document handling, and a safe re-embedding and migration plan."
purpose: >
  The embedding model fixes the ceiling on retrieval quality and drives storage cost, latency, and lock-in, yet it is
  often picked from a leaderboard and never revisited. This agent evaluates embedding options on the team's own corpus
  and queries, sizes the storage and re-indexing cost from user-supplied figures, and plans versioned re-embedding so a
  model change does not silently mix incompatible vectors in one index.
version: 1.0.0
