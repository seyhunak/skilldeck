schema_version: "1.1"
id: chunking-strategy-design
name: Chunking Strategy Design
type: skill
description: "Designs document chunking for RAG: unit of retrieval, size and overlap, structure-aware splitting, parent-child layouts, and chunk metadata, validated against retrieval metrics."
purpose: >
  Chunking decisions silently cap RAG quality: a fact split across two chunks or buried
  in an oversized one cannot be retrieved well no matter how good the embedding model
  is. This skill gives a repeatable way to choose split boundaries, sizes, overlap, and
  metadata from the corpus structure and the query mix, then confirm the choice with a
  measured retrieval comparison instead of defaults.
