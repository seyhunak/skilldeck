schema_version: "1.1"
id: retrieval-quality-metrics
name: Retrieval Quality Metrics
type: skill
description: "Computes and interprets recall@k, precision@k, MRR, nDCG, and hit rate over a labeled query set, with per-segment breakdowns and sound comparison between retriever variants."
purpose: >
  Teams tune retrievers by eyeballing a few queries, which hides regressions and
  overfits to anecdotes. This skill defines how to build qrels, compute the standard
  ranking metrics correctly (including edge cases such as zero relevant documents and
  graded relevance), and decide whether a difference between two retrievers is real, so
  retrieval changes are judged on evidence.
