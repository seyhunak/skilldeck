schema_version: "1.1"
id: hybrid-search-tuning
name: Hybrid Search Tuning
type: skill
description: "Tunes hybrid lexical plus vector retrieval: BM25 configuration, fusion with reciprocal rank fusion or weighted scores, candidate depth, cross-encoder reranking, and weight sweeps measured on a labeled query set."
purpose: >
  Pure vector search misses exact identifiers and rare terms, while pure BM25 misses
  paraphrase. Hybrid retrieval fixes both only when fusion, candidate depth, and
  reranking are tuned on real queries. This skill gives a measured procedure for
  choosing a fusion method and parameters, adding reranking where it pays off, and
  checking latency, so hybrid search improves recall without guesswork.
