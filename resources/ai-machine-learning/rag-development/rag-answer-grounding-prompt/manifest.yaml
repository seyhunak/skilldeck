schema_version: "1.1"
id: rag-answer-grounding-prompt
name: RAG Answer Grounding
type: prompt
description: Answers a question strictly from supplied retrieved passages, citing passage ids per claim, abstaining when evidence is missing, and surfacing conflicts between sources.
purpose: >
  The generation step of a RAG system is where retrieved evidence is either respected
  or quietly overridden by the model's prior knowledge. This prompt is a hardened
  answer template: passage-level citations on every factual sentence, an explicit
  abstain path, conflict reporting, and resistance to instructions embedded in
  retrieved text, so answers can be audited and faithfulness can be measured.
