schema_version: "1.1"
id: rag-pipeline-evaluation-routine
name: RAG Pipeline Evaluation Routine
type: routine
description: A periodic review of a live RAG system that separates retrieval from generation quality, checks corpus freshness and coverage gaps, and turns findings into a prioritized fix list.
purpose: >
  RAG quality decays without any code change: documents go stale, new topics appear
  in user questions, and index or embedding changes shift recall. This routine gives
  a team a repeatable monthly or quarterly review that measures retrieval and answer
  faithfulness separately on a maintained query set plus fresh production samples,
  attributes each failure to a pipeline stage, and tracks results across cycles.
