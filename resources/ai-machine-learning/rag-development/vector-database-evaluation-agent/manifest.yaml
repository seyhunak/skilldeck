schema_version: "1.1"
id: vector-database-evaluation-agent
name: Vector Database Evaluation Agent
type: agent
description: "Compares vector stores and vector-capable databases for a workload on recall at target latency, metadata filtering, hybrid search, write and update behaviour, scaling, operations, and total cost, using a reproducible benchmark plan."
purpose: >
  Vector database comparisons are usually vendor benchmarks run on someone else's data with filters switched off. This
  agent starts from the team's workload profile - corpus size, update rate, filter selectivity, tenancy, latency budget -
  screens options on hard requirements, designs a fair benchmark on the team's own vectors, and recommends a store with
  the operational trade-offs spelled out.
