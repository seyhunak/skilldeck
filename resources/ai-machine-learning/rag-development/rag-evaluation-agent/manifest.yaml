schema_version: "1.1"
id: rag-evaluation-agent
name: RAG Evaluation Agent
type: agent
description: "Evaluates a retrieval-augmented generation pipeline stage by stage - retrieval recall@k, context precision, faithfulness, answer relevance - and classifies failures with a RAG-specific taxonomy."
purpose: >
  RAG systems fail in ways an end-to-end score hides: the right passage was never indexed, was retrieved but ranked too low,
  was cut by the context budget, or was ignored by the generator. This agent separates retrieval quality from generation
  quality, labels every failing query with a root-cause category, and returns a prioritized fix list grounded in the
  team's own query set and traces.
version: 1.0.0
author:
  name: Seyhun Akyürek
  github: seyhunak
license: MIT
domain: ai-machine-learning
use_cases: [rag-development, llm-evaluation]
tags: [rag, retrieval, evaluation, faithfulness, recall-at-k, failure-analysis]
created: "2026-11-09"
updated: "2026-11-09"
content:
  entrypoint: agent.md
  files: [references/rag-failure-taxonomy.md]
compatibility:
  - {platform: claude-code, level: native_install, resource_types: [agent]}
  - {platform: codex, level: file_export, resource_types: [agent]}
  - {platform: claude-desktop, level: copy_paste, resource_types: [agent]}
  - {platform: generic, level: generic_export, resource_types: [agent]}
dependencies: [retrieval-quality-metrics, hallucination-detection]
related: [rag-pipeline-evaluation-routine, chunking-strategy-design, hybrid-search-tuning, embedding-strategy-agent, llm-judge-rubric-design, rag-answer-grounding-prompt]
featured: true
safety:
