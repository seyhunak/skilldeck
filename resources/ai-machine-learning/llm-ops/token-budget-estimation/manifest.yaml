schema_version: "1.1"
id: token-budget-estimation
name: Token Budget Estimation
type: skill
description: "Estimates tokens, cost, and latency per request and per month for an LLM feature, from prompt anatomy, traffic, caching, and retries, with sensitivity ranges and explicit pricing assumptions."
purpose: >
  LLM feature budgets are often set from a single back-of-envelope guess that ignores
  system prompts, retrieved context, retries, and output length variance. This skill
  builds a transparent per-request token model, scales it to traffic with
  low/expected/high scenarios, applies prices the user verifies from the provider's
  current price page, and shows which levers move cost most.
