schema_version: "1.1"
id: llm-feature-launch-routine
name: LLM Feature Launch Routine
type: routine
description: Takes an LLM feature from a measured eval baseline through launch criteria, shadow and canary stages, and monitored ramp to general availability, with rollback triggers at each stage.
purpose: >
  LLM features fail in production in ways unit tests never see: quality drift on real
  traffic, cost blowouts from long inputs, latency tails, and safety incidents from
  inputs nobody imagined. This routine standardizes the path from "the demo works"
  to general availability: written launch criteria, an eval baseline, staged exposure
  with explicit go/no-go gates, and a rollback plan rehearsed before it is needed.
