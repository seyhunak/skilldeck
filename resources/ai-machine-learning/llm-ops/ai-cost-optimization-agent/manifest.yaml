schema_version: "1.1"
id: ai-cost-optimization-agent
name: AI Cost Optimization Agent
type: agent
description: "Analyzes LLM token spend by feature, model, and request type, then ranks savings levers - prompt trimming, caching, batching, routing, model tiering, output limits - with estimated impact and quality-risk checks."
purpose: >
  LLM bills grow faster than usage because prompts accrete context, retries hide in middleware, and every request goes
  to the largest model. This agent decomposes spend from the team's own usage data and current prices the user supplies,
  finds where tokens actually go, and proposes savings levers ordered by expected impact and risk, each paired with the
  eval that proves quality did not regress.
