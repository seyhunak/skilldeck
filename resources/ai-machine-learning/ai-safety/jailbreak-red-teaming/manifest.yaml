schema_version: "1.1"
id: jailbreak-red-teaming
name: Jailbreak Red Teaming
type: skill
description: "Plans and runs authorized adversarial testing of your own LLM application: scope and rules of engagement, threat model, attack-category coverage, safe test-case design, severity scoring, and remediation tracking."
purpose: >
  LLM applications ship with policies that are rarely tested against deliberate misuse.
  This skill structures an authorized red-team exercise on an application the user owns
  or is permitted to test: it defines scope and stop conditions, maps attack categories
  to the app's real risks, designs test cases with benign canary objectives, scores
  findings consistently, and feeds them into guardrail fixes and regression suites.
