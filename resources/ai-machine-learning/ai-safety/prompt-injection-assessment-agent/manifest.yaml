schema_version: "1.1"
id: prompt-injection-assessment-agent
name: Prompt Injection Assessment Agent
type: agent
description: "Assesses an LLM application for direct and indirect prompt injection: maps untrusted input sources, tool permissions, and data exfiltration paths, then rates exploitability and recommends layered mitigations."
purpose: >
  Prompt injection is an architectural problem, not a wording problem: any untrusted text that reaches a model with
  access to private data and an outbound channel can turn the model against its user. This agent maps where untrusted
  content enters, what the model can read and do, and how data could leave, then designs authorized test cases and ranks
  findings so teams fix the highest-impact paths first.
version: 1.0.0
author:
  name: Seyhun Akyürek
  github: seyhunak
license: MIT
domain: ai-machine-learning
use_cases: [ai-safety]
tags: [prompt-injection, llm-security, ai-safety, threat-assessment, data-exfiltration]
created: "2026-11-09"
updated: "2026-11-09"
content:
