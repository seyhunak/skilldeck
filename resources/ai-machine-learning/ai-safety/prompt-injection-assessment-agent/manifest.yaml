  files: [references/injection-test-matrix.md]
compatibility:
  - {platform: claude-code, level: native_install, resource_types: [agent]}
  - {platform: codex, level: file_export, resource_types: [agent]}
  - {platform: claude-desktop, level: copy_paste, resource_types: [agent]}
  - {platform: generic, level: generic_export, resource_types: [agent]}
dependencies: [jailbreak-red-teaming]
related: [ai-guardrails-design-agent, threat-modeling-agent, application-security-audit-agent, mcp-server-design-agent, stride-threat-enumeration]
featured: false
safety:
  contains_scripts: false
  network_access: false
  handles_sensitive_data: true
  notes: "For authorized assessment of systems the user owns or is permitted to test. Test payloads are benign canaries; never exfiltrate real data, target third-party systems, or run tests against production without written approval from the system owner."
