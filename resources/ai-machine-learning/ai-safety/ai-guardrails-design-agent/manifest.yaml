schema_version: "1.1"
id: ai-guardrails-design-agent
name: AI Guardrails Design Agent
type: agent
description: "Designs layered guardrails for an LLM application: input and output policies, classifiers and validators, action gating, escalation to humans, fallback behaviour, and the test suite that measures over- and under-blocking."
purpose: >
  Guardrails are usually added as a single moderation call after an incident, which either blocks legitimate users or
  misses the actual risk. This agent derives guardrails from the application's specific harms and policies, places each
  control at the layer where it is cheapest and most reliable, defines what happens when a control fires, and specifies
  how to measure false positives and false negatives before and after launch.
