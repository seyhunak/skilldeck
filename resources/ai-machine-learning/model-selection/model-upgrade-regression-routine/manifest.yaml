schema_version: "1.1"
id: model-upgrade-regression-routine
name: Model Upgrade Regression Routine
type: routine
description: A controlled procedure for swapping an LLM version in a launched feature, using paired evals, per-case diffs, prompt re-tuning, and a reversible rollout with the old model kept available.
purpose: >
  New model versions are not drop-in replacements: they change formatting habits,
  refusal boundaries, tool-calling behavior, verbosity, token counts, and latency, and
  aggregate eval scores can improve while specific critical cases regress. This
  routine makes a model swap a paired comparison on the same inputs, inspects
  per-case flips rather than averages, and keeps the previous model one switch away.
