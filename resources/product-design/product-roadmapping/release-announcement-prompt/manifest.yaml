schema_version: "1.1"
id: release-announcement-prompt
name: Release Announcement
type: prompt
description: "Writes customer-facing release notes and a short announcement from internal change details, leading with user benefit, stating availability and required actions, and avoiding internal jargon or overpromising."
purpose: >
  Internal changelogs are written for engineers; customers need to know what changed for
  them, who gets it, and whether they must do anything. This prompt converts tickets or
  internal notes into benefit-led, accurate release notes in several lengths, with
  explicit availability, migration steps, and known limitations.
version: 1.0.0
author:
  name: Seyhun Akyürek
  github: seyhunak
license: MIT
domain: product-design
use_cases: [product-roadmapping]
tags: [release-notes, announcement, product-marketing, changelog, communication]
created: "2026-11-09"
updated: "2026-11-09"
content:
  entrypoint: prompt.md
  files: []
compatibility:
