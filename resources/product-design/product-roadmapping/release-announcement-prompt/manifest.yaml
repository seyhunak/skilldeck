  - {platform: codex, level: native_install, resource_types: [prompt]}
  - {platform: claude-desktop, level: copy_paste, resource_types: [prompt]}
  - {platform: generic, level: generic_export, resource_types: [prompt]}
dependencies: []
related: [changelog-and-release-notes, feature-launch-routine, plain-language-rewriting, brand-voice-guardian-agent]
featured: false
