schema_version: "1.1"
id: rice-prioritization
name: RICE Prioritization
type: skill
description: "Scores backlog items with RICE (Reach x Impact x Confidence / Effort) using consistent scales, documented evidence for each input, and a sensitivity check before presenting a ranked list."
purpose: >
  RICE is popular because it forces teams to state reach, impact, confidence, and effort
  explicitly, but it is easy to game with optimistic guesses. This skill applies the
  formula with calibrated scales, records the evidence behind each number, penalizes
  guesswork through the confidence factor, and checks whether the ranking is stable
  before anyone treats it as a decision.
