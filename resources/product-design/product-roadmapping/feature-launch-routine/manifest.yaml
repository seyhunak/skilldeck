schema_version: "1.1"
id: feature-launch-routine
name: Feature Launch Routine
type: routine
description: "A cross-functional, human-supervised launch checklist from readiness review to post-launch review: tiering, go/no-go criteria, staged rollout, enablement, communications, monitoring, and rollback."
purpose: >
  Launches fail at the seams between teams: support learns about the feature from
  customers, metrics were never instrumented, or nobody owns the rollback decision. This
  routine sizes the launch by tier, assigns owners, gates release on explicit go/no-go
  criteria, coordinates enablement and communications, and closes with a measured post-
  launch review.
