schema_version: "1.1"
id: feature-prioritization-agent
name: Feature Prioritization Agent
type: agent
description: "Weighs a backlog of candidate features using an appropriate framework (RICE, cost of delay/WSJF, Kano, value-vs-effort), surfaces trade-offs and sensitivity, and returns a ranked list with a defensible rationale."
purpose: >
  Backlogs are usually prioritized by whoever argues loudest, and scoring frameworks are
  often applied mechanically to numbers nobody believes. This agent chooses a framework
  that fits the decision, normalizes inputs, exposes which scores are guesses, tests
  whether the ranking survives reasonable changes in assumptions, and writes a
  recommendation that names what is being deferred and why.
