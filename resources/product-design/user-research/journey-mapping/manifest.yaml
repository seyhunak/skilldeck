schema_version: "1.1"
id: journey-mapping
name: Journey Mapping
type: skill
description: "Builds a current-state customer journey map for one persona and scenario: stages, actions, touchpoints, thoughts, emotional curve, pain points, and prioritized opportunities, each grounded in research evidence."
purpose: >
  Journey maps are useful when they expose where an experience breaks across channels
  and teams, and useless when they are decorative posters. This skill guides an agent to
  scope one persona and scenario, build the map lane by lane from evidence, mark moments
  of truth and drop-offs, and convert pain points into owned, prioritized opportunities.
