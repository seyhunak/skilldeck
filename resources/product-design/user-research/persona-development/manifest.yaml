schema_version: "1.1"
id: persona-development
name: Persona Development
type: skill
description: "Builds evidence-based personas from research data by clustering behaviors, goals, and contexts rather than demographics, with an evidence trail, anti-persona, and explicit validity limits."
purpose: >
  Personas invented in a workshop encode stereotypes and get ignored; personas built
  from behavioral evidence change design decisions. This skill guides an agent to
  identify behavioral variables, place participants on them, find clusters, and write
  lean personas that cite the research behind every attribute and state how many
  participants they rest on.
