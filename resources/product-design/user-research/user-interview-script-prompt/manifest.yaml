schema_version: "1.1"
id: user-interview-script-prompt
name: User Interview Script
type: prompt
description: "Generates a non-leading, past-behavior-focused user interview script with screener criteria, warm-up, story-based core questions, probes, and a wrap-up, tailored to a research goal and participant type."
purpose: >
  Most interview scripts ask people to predict their future behavior or validate the
  team's idea, which produces polite, useless answers. This prompt produces a script
  anchored in specific past events, with neutral wording, follow-up probes, and a bias
  check, so a single interviewer can run sessions that yield evidence.
