schema_version: "1.1"
id: ux-research-synthesis-agent
name: UX Research Synthesis Agent
type: agent
description: "Synthesizes interview transcripts and research notes through affinity mapping into themed, evidence-weighted insights with supporting quotes, contradictions, and implications for product decisions."
purpose: >
  Raw interview notes are rarely acted on because synthesis is slow and easily biased
  toward what the team already believes. This agent atomizes observations, clusters them
  bottom-up, counts how many participants support each theme, keeps disconfirming
  evidence visible, and writes insights in a form a product team can act on, with every
  claim traceable to a participant and quote.
