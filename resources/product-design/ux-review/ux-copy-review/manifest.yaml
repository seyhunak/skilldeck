schema_version: "1.1"
id: ux-copy-review
name: UX Copy Review
type: skill
description: "Reviews interface microcopy (buttons, labels, empty states, errors, confirmations, notifications) for clarity, consistency, tone, and actionability, returning line-by-line rewrites with the rule each fix applies."
purpose: >
  Interface text carries much of the usability of a product, but it is usually written
  last and reviewed by nobody. This skill gives an agent a concrete rubric for
  microcopy: specific verbs on buttons, errors that explain what happened and how to fix
  it, consistent terminology, appropriate tone for the moment, and length that fits the
  component.
