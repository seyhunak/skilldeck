schema_version: "1.1"
id: accessibility-design-review
name: Accessibility Design Review
type: skill
description: "Reviews designs before build against WCAG 2.2 AA concerns that are decided at design time: color contrast, target size, focus and interaction states, text alternatives, reading order, motion, and form error design."
purpose: >
  Many accessibility defects are baked in at the design stage and become expensive once
  components ship. This skill lets an agent review mockups, prototypes, and design specs
  for the WCAG 2.2 success criteria a designer controls, compute contrast ratios
  correctly, check state coverage, and write annotations developers need, while being
  clear about what only code-level and assistive-technology testing can confirm.
