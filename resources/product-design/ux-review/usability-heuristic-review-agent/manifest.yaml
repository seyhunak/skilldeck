schema_version: "1.1"
id: usability-heuristic-review-agent
name: Usability Heuristic Review Agent
type: agent
description: "Evaluates screens, prototypes, or flows against Nielsen's 10 usability heuristics and returns severity-rated findings tied to specific screens and elements, each with a concrete recommended fix."
purpose: >
  Heuristic evaluation is the fastest way to catch usability problems before user
  testing, but ad-hoc reviews produce vague opinions. This agent walks a defined task
  flow screen by screen, maps each issue to a named heuristic, rates severity on the 0-4
  Nielsen scale using frequency, impact, and persistence, and produces a findings log
  the design team can triage directly.
