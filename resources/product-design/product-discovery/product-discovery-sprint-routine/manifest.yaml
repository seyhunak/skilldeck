schema_version: "1.1"
id: product-discovery-sprint-routine
name: Product Discovery Sprint Routine
type: routine
description: "A supervised two-week discovery cycle: frame the outcome, map assumptions, run interviews and lightweight experiments, synthesize evidence, and end with a documented build, pivot, or stop decision."
purpose: >
  Discovery without a cadence drifts into endless research or collapses into building
  the first idea. This routine gives a product trio a repeatable two-week cycle with
  fixed checkpoints, pre-committed evidence thresholds, and a decision review, so each
  cycle ends with a clear, documented choice backed by what customers actually did and
  said.
