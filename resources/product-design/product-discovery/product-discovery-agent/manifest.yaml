schema_version: "1.1"
id: product-discovery-agent
name: Product Discovery Agent
type: agent
description: "Maps the assumptions behind a product idea, ranks them by importance and evidence, and designs the smallest experiments that would de-risk the riskiest ones, returning an assumption map and test plan."
purpose: >
  Teams often build the first idea they agree on and learn too late that customers do
  not want it, cannot use it, or that it cannot be delivered profitably. This agent
  makes the hidden assumptions explicit across desirability, viability, feasibility, and
  usability, ranks them, and pairs the riskiest with cheap, falsifiable experiments with
  pre-committed success thresholds, so discovery produces evidence rather than opinions.
