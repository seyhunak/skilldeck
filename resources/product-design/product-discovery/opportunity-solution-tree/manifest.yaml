schema_version: "1.1"
id: opportunity-solution-tree
name: Opportunity Solution Tree
type: skill
description: "Builds an opportunity solution tree linking one measurable outcome to customer opportunities, multiple candidate solutions per opportunity, and assumption tests, then selects a target opportunity."
purpose: >
  Teams jump from a goal straight to a single favourite feature. An opportunity solution
  tree keeps the outcome, the customer needs that could drive it, several competing
  solutions, and the experiments that test them visible in one structure. This skill
  guides an agent to build, prune, and use the tree to choose what to explore next.
