schema_version: "1.1"
id: jobs-to-be-done-analysis
name: Jobs-to-be-Done Analysis
type: skill
description: "Analyzes customer research through the Jobs-to-be-Done lens: writes solution-free job statements, maps the job and its desired outcomes, and charts the four forces of progress behind switching."
purpose: >
  Feature requests describe solutions; jobs describe the progress people are trying to
  make. This skill gives any agent a disciplined way to extract functional, emotional,
  and social jobs from interviews or switch stories, write them in a consistent
  solution-agnostic format, chart push, pull, anxiety, and habit forces, and turn the
  result into opportunities a team can design for.
