schema_version: "1.1"
id: product-analytics-instrumentation-agent
name: Product Analytics Instrumentation Agent
type: agent
description: "Designs an event taxonomy and tracking plan from product questions: naming convention, events, properties, identity rules, metric mappings, privacy review, and QA steps, returned as an implementation-ready tracking plan."
purpose: >
  Analytics data is usually untrustworthy because events were added ad hoc, named
  inconsistently, and never tied to the questions the business asks. This agent starts
  from decisions and metrics, derives the minimum set of events and properties needed to
  answer them, applies a consistent object-action naming convention, defines identity
  and governance rules, flags personal data, and specifies how to QA the implementation.
version: 1.0.0
author:
  name: Seyhun Akyürek
  github: seyhunak
license: MIT
domain: product-design
use_cases: [product-analytics, product-discovery]
tags: [product-analytics, event-tracking, tracking-plan, taxonomy, instrumentation]
created: "2026-11-09"
updated: "2026-11-09"
content:
  entrypoint: agent.md
  files: [references/naming-convention.md]
compatibility:
  - {platform: claude-code, level: native_install, resource_types: [agent]}
  - {platform: codex, level: file_export, resource_types: [agent]}
  - {platform: claude-desktop, level: copy_paste, resource_types: [agent]}
  - {platform: generic, level: generic_export, resource_types: [agent]}
dependencies: [metric-definition]
related: [data-dictionary-authoring, experiment-analysis-agent, cohort-retention-analysis-agent, kpi-tree-design, privacy-impact-assessment-agent]
featured: false
safety:
  contains_scripts: false
  network_access: false
  handles_sensitive_data: true
  notes: "Designs tracking specifications only and does not deploy code or tags. Flags personal data in event properties, recommends data minimization, and defers consent and lawful-basis questions to the privacy owner."
status: approved
tested: false
tested_with: []
changelog: ["1.0.0: Initial release."]
