schema_version: "1.1"
id: acceptance-criteria-gherkin
name: Acceptance Criteria in Gherkin
type: skill
description: "Writes testable acceptance criteria as Gherkin Given/When/Then scenarios, including scenario outlines, edge cases, and negative paths, written in declarative business language rather than UI scripts."
purpose: >
  Vague acceptance criteria are the most common cause of rework between product,
  engineering, and QA. This skill makes an agent produce declarative, observable
  Given/When/Then scenarios that cover happy paths, rule boundaries, and failure cases,
  structured so they can be read by stakeholders and automated with Cucumber-style tools
  without rewriting.
