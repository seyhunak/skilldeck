schema_version: "1.1"
id: feature-spec-prompt
name: Feature Spec
type: prompt
description: "Produces a one-page feature specification: problem, user and job, proposed behavior, scope and non-goals, key states and edge cases, success metric, risks, and open questions, sized for a single team."
purpose: >
  Not every change needs a full PRD, but every change needs a shared understanding of
  the problem, the behavior, and the boundaries. This prompt turns rough notes into a
  tight one-page spec that engineering and design can review in ten minutes, with
  assumptions and open questions surfaced instead of hidden.
