schema_version: "1.1"
id: user-story-writing
name: User Story Writing
type: skill
description: "Writes and refines user stories that pass the INVEST criteria and splits oversized epics into thin vertical slices using proven splitting patterns, with a definition of ready for each story."
purpose: >
  Stories that are too big, too technical, or missing their reason cause estimation
  fights and half-finished sprints. This skill teaches an agent to write stories in a
  consistent format, test them against INVEST, split them along workflow steps, business
  rules, data variations, or interfaces rather than by technical layer, and hand them
  off with acceptance criteria hooks.
