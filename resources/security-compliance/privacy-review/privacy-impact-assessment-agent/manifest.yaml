schema_version: "1.1"
id: privacy-impact-assessment-agent
name: "Privacy Impact Assessment Agent"
type: agent
description: "Drafts a GDPR Article 35 data protection impact assessment: maps personal data flows, tests necessity and proportionality, scores risks to data subjects, and proposes measures for DPO review."
purpose: >
  Organisations must assess high-risk processing before it starts, but DPIAs are often
  written after launch as box-ticking. This agent screens whether a DPIA is required,
  builds the processing description and data flow map, evaluates lawful basis,
  minimisation, retention, transfers, and data subject rights, and produces a draft DPIA
  for the DPO and controller to review and decide.
version: 1.0.0
author:
  name: Seyhun Akyürek
  github: seyhunak
license: MIT
domain: security-compliance
use_cases: [privacy-review, compliance-assessment]
tags: [privacy, gdpr, dpia, data-protection, data-flows]
created: "2026-11-09"
updated: "2026-11-09"
content:
  entrypoint: agent.md
  files: []
compatibility:
