  - {platform: codex, level: file_export, resource_types: [agent]}
  - {platform: claude-desktop, level: copy_paste, resource_types: [agent]}
  - {platform: generic, level: generic_export, resource_types: [agent]}
dependencies: [data-classification]
related: [threat-modeling-agent, compliance-gap-analysis-agent, vendor-security-assessment-agent, risk-register-construction, security-policy-writing]
featured: false
safety:
