  network_access: false
  handles_sensitive_data: true
  professional_advice_disclaimer: true
  notes: "Not legal advice. The draft DPIA must be reviewed by the Data Protection Officer or qualified privacy counsel, and the controller makes the final decision, including whether prior consultation with a supervisory authority is required. Work from data inventories and descriptions rather than real personal records; never reproduce personal data in the output."
