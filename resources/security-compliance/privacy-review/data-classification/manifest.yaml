schema_version: "1.1"
id: data-classification
name: "Data Classification"
type: skill
description: "Designs or applies a data classification scheme: defines levels, classifies datasets and fields by confidentiality, integrity, and regulatory criteria, and sets handling rules for storage, transfer, sharing, and retention."
purpose: >
  Security controls cannot be proportionate until the organisation knows what data it
  holds and how sensitive it is. This skill produces a small, usable scheme (typically
  four levels), a decision procedure for classifying data, and a handling matrix that
  engineers and staff can apply without a meeting.
