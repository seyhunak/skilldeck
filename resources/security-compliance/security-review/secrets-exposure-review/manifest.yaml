schema_version: "1.1"
id: secrets-exposure-review
name: "Secrets Exposure Review"
type: skill
description: "Finds hard-coded or leaked secrets in repositories, history, CI logs, and configs using manual patterns plus scanner guidance, then drives rotation-first remediation without ever printing a secret value."
purpose: >
  A leaked credential is an incident, not a code smell: removing it from the latest commit
  does nothing if it remains valid and in history. This skill combines manual search
  patterns with guidance for established scanners, classifies each exposure, and sequences
  remediation as revoke and rotate, assess use, then clean history and prevent recurrence.
