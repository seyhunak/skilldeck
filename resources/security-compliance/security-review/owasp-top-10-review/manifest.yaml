schema_version: "1.1"
id: owasp-top-10-review
name: "OWASP Top 10 Review"
type: skill
description: "Reviews application code against the OWASP Top 10:2021 categories (and the 2025 update where the user's team has adopted it), with per-category code patterns to look for and evidence-based findings."
purpose: >
  The OWASP Top 10 is the most widely used awareness baseline for web application risk,
  but reviewing against it needs concrete code patterns, not category names. This skill
  gives an agent a category-by-category inspection procedure with language-agnostic
  signals, false-positive checks, and a findings format.
