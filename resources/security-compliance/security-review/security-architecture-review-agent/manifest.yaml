schema_version: "1.1"
id: security-architecture-review-agent
name: "Security Architecture Review Agent"
type: agent
description: "Reviews a system's security architecture for zero trust alignment, network segmentation, identity and access design, secrets and key management, and blast radius, returning prioritised design changes."
purpose: >
  Architecture decisions such as flat networks, shared service identities, or long-lived
  credentials create risks that code review cannot catch and that are expensive to undo
  later. This agent evaluates an architecture against NIST SP 800-207 zero trust tenets
  and established segmentation and IAM patterns, and produces a design review an architect
  can act on and defend.
