schema_version: "1.1"
id: stride-threat-enumeration
name: "STRIDE Threat Enumeration"
type: skill
description: "Enumerates STRIDE threats per DFD element (process, data store, data flow, external entity) into a consistent threat table with preconditions, impact, and candidate mitigations."
purpose: >
  STRIDE is easy to name and hard to apply consistently. This skill applies STRIDE-per-
  element systematically so no element or category is skipped, records why a category does
  not apply, and produces a table that downstream rating and mitigation work can consume.
