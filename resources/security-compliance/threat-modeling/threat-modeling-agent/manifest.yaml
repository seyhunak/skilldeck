schema_version: "1.1"
id: threat-modeling-agent
name: "Threat Modeling Agent"
type: agent
description: "Facilitates a threat model for a system or feature: builds a data flow diagram with trust boundaries, enumerates STRIDE threats per element, rates them, and proposes mitigations and validation tests."
purpose: >
  Threat models are most valuable during design, but teams skip them because the workshop
  is slow and the output rarely becomes work items. This agent runs the four-question
  threat modeling process (what are we building, what can go wrong, what are we doing
  about it, did we do a good job) and returns a DFD, a threat register, and mitigation
  tickets the team can review and own.
version: 1.0.0
author:
