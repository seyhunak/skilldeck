schema_version: "1.1"
id: quarterly-access-review-routine
name: "Quarterly Access Review Routine"
type: routine
description: "A human-supervised quarterly user access review: scope in-scope systems, pull and reconcile account exports, route exceptions to owners, record decisions, verify removals, and package audit evidence."
purpose: >
  Auditors test that access reviews happen on schedule, cover every in-scope system, are
  performed by the right reviewers, and result in timely removals. This routine
  standardises the quarter's workflow so the review is complete, the evidence is
  consistent, and revocations are verified rather than assumed.
