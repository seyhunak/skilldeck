schema_version: "1.1"
id: access-review
name: "Access Review"
type: skill
description: "Performs a user access review: reconciles accounts against the HR roster, flags orphaned, dormant, privileged, and shared accounts, checks least privilege and segregation of duties conflicts, and records reviewer decisions."
purpose: >
  Access reviews are a core control in SOC 2, ISO 27001, and SOX environments, and they
  routinely fail because reviewers rubber-stamp long lists. This skill reduces the list to
  the exceptions that need judgement, applies explicit rules for orphaned and dormant
  accounts and toxic permission combinations, and produces evidence an auditor can follow.
