schema_version: "1.1"
id: security-policy-writing
name: "Security Policy Writing"
type: skill
description: "Writes and revises information security policies, standards, and procedures with a clear hierarchy, testable requirements, owners, exceptions, and mappings to SOC 2 or ISO 27001 controls."
purpose: >
  Policies fail audits and fail staff when they are aspirational, untestable, or copied
  from templates that describe a different company. This skill separates policy (intent),
  standard (measurable requirement), and procedure (steps), writes requirements with
  shall-language and parameters, and keeps each document tied to what the organisation
  actually does.
