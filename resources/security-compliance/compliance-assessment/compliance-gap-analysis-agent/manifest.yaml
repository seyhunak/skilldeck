schema_version: "1.1"
id: compliance-gap-analysis-agent
name: "Compliance Gap Analysis Agent"
type: agent
description: "Maps an organisation's existing controls and evidence against SOC 2 Trust Services Criteria or ISO/IEC 27001:2022 Annex A, and returns a gap register with evidence status, owners, and a remediation plan."
purpose: >
  Before a SOC 2 or ISO 27001 audit, teams need an honest view of which criteria or
  controls are designed, operating, and evidenced, and which are missing. This agent
  performs a structured readiness gap analysis from policies, system descriptions, and
  evidence samples, separating design gaps from evidence gaps so the remediation plan
  targets what an auditor will actually test.
