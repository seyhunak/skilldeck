dependencies: [security-log-analysis, secrets-exposure-review]
related: [incident-postmortem-routine, production-incident-debugger-agent, security-finding-writeup-prompt, access-review]
featured: false
safety:
  contains_scripts: false
  network_access: false
  handles_sensitive_data: true
  professional_advice_disclaimer: true
  notes: "Not legal or professional incident response advice. Breach notification, regulator or law enforcement contact, and every containment or eradication action require explicit approval from the incident commander and, where applicable, legal counsel. Proposes actions only; never executes them, never sends communications, and never prints credentials or secrets seen in evidence."
