schema_version: "1.1"
id: security-log-analysis
name: "Security Log Analysis"
type: skill
description: "Analyses authentication, cloud audit, web, and endpoint logs for anomalies and indicators of compromise, building a normalised timeline with hypotheses, queries, and confidence levels."
purpose: >
  Investigations stall when analysts stare at raw logs without a hypothesis or a baseline.
  This skill normalises log sources, establishes what normal looks like, hunts for
  specific suspicious patterns such as password spraying, impossible travel, and privilege
  changes, and records findings with the exact evidence and confidence so others can
  reproduce them.
