schema_version: "1.1"
id: chart-selection
name: Chart Selection
type: skill
description: "Chooses the right chart for an analytical question based on the comparison being made, data shape, and audience, and specifies encoding, scale, and annotation rules."
purpose: >
  Most misleading charts are not malicious; they are the wrong form for the question.
  This skill maps the question type (change over time, ranking, part-to-whole,
  distribution, relationship, deviation) to chart forms that support accurate
  perception, and adds the scale, ordering, and labeling rules that keep the chart
  honest.
