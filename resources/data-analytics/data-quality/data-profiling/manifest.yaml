schema_version: "1.1"
id: data-profiling
name: Data Profiling
type: skill
description: "Profiles a table or dataset: row counts, key uniqueness, null rates, distributions, cardinality, ranges, and freshness. Use before analysis, modeling, or trusting a new source."
purpose: >
  Analysts who skip profiling discover duplicate keys and sentinel values after the
  numbers have been shared. This skill defines a repeatable profiling pass with
  concrete queries per column type, heuristics for spotting suspicious patterns, and a
  compact profile report that downstream work can rely on.
