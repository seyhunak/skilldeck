schema_version: "1.1"
id: data-quality-investigation-agent
name: Data Quality Investigation Agent
type: agent
description: "Root-causes a reported data issue (wrong totals, duplicates, missing rows, stale tables) by tracing it through lineage and DQ dimensions, returning an evidence-backed incident report."
purpose: >
  When a dashboard number looks wrong, teams often patch the symptom downstream. This
  agent frames the issue against standard data quality dimensions, reproduces it with
  queries, walks the lineage upstream hop by hop until it finds the stage where good
  data turns bad, and returns a root cause, blast radius, remediation options, and the
  tests that would have caught it.
