schema_version: "1.1"
id: data-dictionary-authoring
name: Data Dictionary Authoring
type: skill
description: "Writes data dictionary entries for tables and columns: business definitions, grain, types, allowed values, null meaning, lineage, owners, and sensitivity classification."
purpose: >
  A data dictionary is only useful if its definitions are precise enough to settle
  arguments. This skill gives a template and writing rules for table and column
  documentation, including grain statements, null semantics, allowed values, lineage,
  ownership, and sensitivity, and a review checklist that catches vague or circular
  definitions.
