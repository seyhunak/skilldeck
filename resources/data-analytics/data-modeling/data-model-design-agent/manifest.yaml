schema_version: "1.1"
id: data-model-design-agent
name: Data Model Design Agent
type: agent
description: "Designs analytical data models: business process, declared grain, fact and dimension tables, conformed dimensions, slowly changing dimension strategy, keys, and tests."
purpose: >
  Most analytics pain traces back to an undeclared grain or a dimension that silently
  overwrites history. This agent applies dimensional modeling discipline to a business
  process: it declares the grain, identifies facts and dimensions, chooses SCD types
  per attribute, designs keys and conformed dimensions, and returns a model
  specification with DDL-style sketches and the tests that keep it honest.
