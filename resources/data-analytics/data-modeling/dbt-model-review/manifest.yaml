schema_version: "1.1"
id: dbt-model-review
name: dbt Model Review
type: skill
description: "Reviews dbt projects and models: layer structure, ref/source usage, materializations, incremental logic, tests, documentation, and configs. Use on dbt pull requests or project audits."
purpose: >
  dbt makes transformations easy to write and easy to get subtly wrong. This skill
  provides a structured review of a dbt model or project covering
  staging/intermediate/mart layering, correct use of ref and source, materialization
  and incremental strategy choices, test coverage, and documentation, with findings
  phrased as concrete changes.
