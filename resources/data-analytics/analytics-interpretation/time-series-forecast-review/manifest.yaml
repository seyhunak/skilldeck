schema_version: "1.1"
id: time-series-forecast-review
name: Time Series Forecast Review
type: skill
description: "Reviews a time series forecast for seasonality handling, leakage, backtesting design, baselines, error metrics (MAE, MAPE, sMAPE, MASE), and prediction intervals."
purpose: >
  Forecasts get adopted because their charts look smooth, not because they beat a
  naive baseline. This skill reviews a forecast the way a skeptical analyst would:
  decomposition and seasonality, leakage, rolling-origin backtests, the right error
  metrics for the data, interval calibration, and how the forecast will be used.
