schema_version: "1.1"
id: metric-definition
name: Metric Definition
type: skill
description: "Writes unambiguous metric specifications: formula, numerator and denominator, unit, grain, time window, filters, exclusions, edge cases, owner, and reference SQL."
purpose: >
  Two teams reporting different numbers for the same metric name is the most common
  analytics failure. This skill produces a metric spec that pins down every decision
  that changes the number, including population, time attribution, deduplication,
  currency, and late data, plus guardrails and a reference implementation.
