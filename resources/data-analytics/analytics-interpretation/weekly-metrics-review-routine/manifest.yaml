schema_version: "1.1"
id: weekly-metrics-review-routine
name: Weekly Metrics Review Routine
type: routine
description: A weekly review of a team's core metrics that checks data freshness first, compares against expected ranges, triages notable movements, and records owners and actions in a running log.
purpose: >
  Weekly metric reviews tend to drift into reading every number aloud and debating
  noise. This routine keeps the review short and useful: verify the data is complete,
  compare each metric with a seasonally fair baseline and an expected range, spend
  discussion time only on movements outside that range, assign an owner to each open
  question, and keep a log so recurring issues and past explanations are visible.
