schema_version: "1.1"
id: insight-narrative-prompt
name: Insight Narrative
type: prompt
description: Turns tables, query results, or analysis notes into a decision-oriented written narrative that leads with the answer, quantifies effects, separates evidence from interpretation, and states caveats.
purpose: >
  Analyses often die in the handoff: a correct chart with a caption that restates the
  axis, or a long walk through every cut the analyst tried. This prompt converts
  results into a short narrative structured around the decision the reader faces,
  with every number traceable to the supplied data, causal language limited to what
  the method supports, and explicit caveats and next steps.
