schema_version: "1.1"
id: metric-anomaly-investigation-agent
name: Metric Anomaly Investigation Agent
type: agent
description: "Explains why a metric moved: validates the change is real, decomposes it by drivers and segments, tests hypotheses, and returns a ranked explanation with quantified contributions."
purpose: >
  When a KPI jumps or drops, the first explanation offered is usually the wrong one.
  This agent first rules out data and definition artifacts, compares against
  seasonality and expected ranges, decomposes the metric arithmetically into
  components and segments, separates mix effects from rate effects, and returns a
  ranked, quantified explanation with confidence levels and next steps.
