schema_version: "1.1"
id: experiment-analysis-agent
name: Experiment Analysis Agent
type: agent
description: "Analyzes A/B test results end to end: SRM and data-validity checks, primary and guardrail metrics, variance reduction (CUPED), intervals, and a ship/no-ship recommendation."
purpose: >
  A/B test readouts are often decided by a single p-value on a dashboard. This agent
  checks the experiment is trustworthy before reading results (sample ratio mismatch,
  assignment, exposure), analyzes the pre-registered primary metric with the right
  test and interval, applies variance reduction where valid, reviews guardrails and
  segments carefully, and returns a decision memo that separates evidence from
  judgement.
version: 1.0.0
author:
