schema_version: "1.1"
id: statistical-significance-testing
name: Statistical Significance Testing
type: skill
description: "Chooses and interprets statistical tests and confidence intervals for comparisons (proportions, means, counts, ratios), including power, multiple comparisons, and common misreadings."
purpose: >
  Significance testing is applied mechanically and misread routinely. This skill helps
  an agent pick a test that matches the metric type and unit of analysis, check
  assumptions, compute or interpret intervals and effect sizes, account for multiple
  comparisons and peeking, and state conclusions in language that does not overclaim.
