schema_version: "1.1"
id: sql-query-review
name: SQL Query Review
type: skill
description: "Reviews analytical SQL for correctness: join fan-out, null semantics, filter placement, window frames, date boundaries, and grain. Use before trusting or shipping a query's numbers."
purpose: >
  Analytical SQL usually fails silently: it returns a plausible number that is wrong.
  This skill gives any agent a systematic correctness checklist for SELECT queries,
  focused on the classic traps that inflate or drop rows, and a verification plan of
  cheap queries that prove the result is right rather than merely runnable.
