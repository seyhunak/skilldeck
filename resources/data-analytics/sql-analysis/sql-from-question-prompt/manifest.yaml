schema_version: "1.1"
id: sql-from-question-prompt
name: SQL From Question
type: prompt
description: Translates a business question into a dialect-specific analytical SQL query against a supplied schema, stating grain, metric definitions, and assumptions, with sanity-check queries.
purpose: >
  Natural-language-to-SQL usually fails not on syntax but on meaning: which table is
  the source of truth, what counts as an active user, whether a join fans out, how
  nulls and time zones are handled. This prompt makes those choices explicit before
  writing the query, refuses to guess column names that are not in the schema, and
  returns verification queries so the analyst can trust the number before sharing it.
