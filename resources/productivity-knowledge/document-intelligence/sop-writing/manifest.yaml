schema_version: "1.1"
id: sop-writing
name: SOP Writing
type: skill
description: "Writes standard operating procedures with purpose, scope, roles, prerequisites, imperative numbered steps, expected results, control points, exceptions, records, and document control."
purpose: >
  Processes that live in one person's head fail when that person is away. This skill
  converts real practice into a controlled procedure that a trained person can follow
  consistently and an auditor can check: defined trigger and end state, role-based
  responsibilities, verifiable steps, marked control points and warnings, escalation
  paths, records, and revision history, validated by a walkthrough with someone who did
  not write it.
