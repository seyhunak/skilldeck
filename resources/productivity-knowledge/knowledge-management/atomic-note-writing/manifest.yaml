schema_version: "1.1"
id: atomic-note-writing
name: Atomic Note Writing
type: skill
description: "Writes Zettelkasten-style permanent notes: one idea per note, claim-style title, own words, cited source, and contextual links, plus structure notes for growing clusters."
purpose: >
  Collected highlights rarely become usable knowledge. This skill turns source material
  into atomic, standalone notes that are reformulated in the writer's own words, keep
  provenance separate from interpretation, and link to existing notes with a stated
  relationship, so a personal or team knowledge base grows into a navigable network rather
  than a pile.
