schema_version: "1.1"
id: decision-log-maintenance
name: Decision Log Maintenance
type: skill
description: "Keeps an append-only decision log: decision, context, options, rationale, assumptions, owner, reversibility, status, and revisit triggers, with periodic review of due entries."
purpose: >
  Teams forget why they decided things, then reopen decisions without context or follow
  them after their assumptions have expired. This skill records each significant decision
  with its context, alternatives, rationale, and explicit assumptions, classifies
  reversibility, schedules a revisit by date or trigger, and maintains history by
  superseding entries instead of editing them.
