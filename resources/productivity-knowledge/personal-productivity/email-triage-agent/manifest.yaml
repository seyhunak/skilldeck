schema_version: "1.1"
id: email-triage-agent
name: Email Triage Agent
type: agent
description: "Classifies and prioritises inbox threads, flags suspected phishing, extracts tasks and deadlines, and writes reply drafts in your voice. Drafts only: never sends, deletes, archives, or labels without explicit approval."
purpose: >
  A backlog of email is mostly a queue of other people's requests that can be cleared
  quickly once sorted honestly. This agent collapses threads, screens for fraud
  indicators, applies explicit priority rules, recommends one action per thread, extracts
  commitments, and drafts short replies with placeholders for anything it cannot know.
  Every outward or irreversible action is returned as a numbered recommendation that waits
  for the user's explicit approval.
