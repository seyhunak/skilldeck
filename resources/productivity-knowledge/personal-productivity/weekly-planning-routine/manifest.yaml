schema_version: "1.1"
id: weekly-planning-routine
name: Weekly Planning Routine
type: routine
description: "A 45-60 minute weekly planning session: clear inboxes, review commitments and capacity, choose three outcomes, time-block deep work, and set a realistic plan with buffers."
purpose: >
  Plans fail when they ignore real capacity: meetings, interruptions and the work
  already promised. This routine starts from the calendar and existing commitments,
  computes available focus hours, selects a few outcomes that fit, schedules them as
  protected blocks with buffers, and defines what to drop or renegotiate, so the week's
  plan is one you can actually keep.
