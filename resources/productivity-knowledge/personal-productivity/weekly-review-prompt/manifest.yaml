schema_version: "1.1"
id: weekly-review-prompt
name: Weekly Review
type: prompt
description: "A reflective weekly review prompt that turns your notes, calendar and task list into wins, misses, lessons, open loops, energy patterns and a short set of carry-forward commitments."
purpose: >
  Weekly reviews decay into either a task dump or vague journaling. This prompt guides a
  structured reflection: what happened versus what was planned, why the gaps occurred,
  which open loops need a decision, what drained or restored energy, and three to five
  commitments to carry into next week, written in your own words rather than generic
  advice.
