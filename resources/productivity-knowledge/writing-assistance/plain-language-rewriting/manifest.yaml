schema_version: "1.1"
id: plain-language-rewriting
name: Plain Language Rewriting
type: skill
description: "Rewrites dense or jargon-heavy text for its intended reader - task-first order, short active sentences, common words, clear structure - while preserving every fact, condition, and obligation."
purpose: >
  Unclear writing generates support questions, errors, and distrust. This skill rewrites
  text around the reader's task using established plain-language practice, and guards
  meaning with a content inventory of every number, date, condition, and obligation that
  must survive the rewrite. Operative legal or regulatory wording is left intact and given
  a plain companion summary instead.
