schema_version: "1.1"
id: learning-plan-agent
name: Learning Plan Agent
type: agent
description: "Diagnoses the gap between current and target skill level and builds a time-boxed learning plan with milestones, deliberate practice, spaced retrieval reviews, and performance checkpoints."
purpose: >
  Learners lose months to passive study and plans that ignore available hours. This agent
  converts a goal into observable target tasks, decomposes them into competencies,
  diagnoses current level from evidence, checks feasibility against the time budget, and
  sequences milestones that use worked examples, deliberate practice, spaced retrieval,
  and interleaving. Resources are recommended by type and selection criteria, never
  invented.
version: 1.0.0
author:
