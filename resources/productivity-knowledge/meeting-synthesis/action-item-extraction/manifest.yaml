schema_version: "1.1"
id: action-item-extraction
name: Action Item Extraction
type: skill
description: "Extracts commitments from meetings, emails, and chats into tracker-ready items with verb-first task, single owner, stated due date, definition of done, dependency, and source."
purpose: >
  Dropped work is usually work that was never captured precisely. This skill detects
  commitment signals, rewrites them as concrete verb-first tasks with one accountable
  owner, resolves relative dates against the source date, adds an observable definition of
  done, and lists unowned, undated, vague, or conditional items separately so a human can
  close the gaps.
