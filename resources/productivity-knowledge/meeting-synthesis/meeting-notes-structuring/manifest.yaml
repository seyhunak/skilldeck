schema_version: "1.1"
id: meeting-notes-structuring
name: Meeting Notes Structuring
type: skill
description: "Structures any meeting write-up into a consistent layout with outcomes first: decisions, action items, open questions, then per-topic notes and parking lot."
purpose: >
  Meeting notes are read by people who were absent and by attendees weeks later, and both
  need outcomes before discussion. This skill applies one consistent layout with precise
  decision wording, a fixed action-item format with owner, due date, and definition of
  done, and explicit gaps where nothing was agreed, so notes across a team become
  comparable and searchable.
