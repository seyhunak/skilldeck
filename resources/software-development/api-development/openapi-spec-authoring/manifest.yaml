schema_version: "1.1"
id: openapi-spec-authoring
name: OpenAPI Spec Authoring
type: skill
description: "Writes and lints OpenAPI 3.1 specs with reusable JSON Schema components, realistic examples, security schemes, and an RFC 9457 problem-details error model."
purpose: >
  Client generators, mock servers, gateways, and humans all depend on the API contract.
  This skill produces OpenAPI 3.1 documents that validate and lint cleanly, describe
  errors as carefully as successes, generate sensible SDK method names, and flag
  breaking changes against the published version.
