schema_version: "1.1"
id: graphql-schema-review
name: GraphQL Schema Review
type: skill
description: "Reviews GraphQL SDL and resolvers for nullability, Relay connections, mutation input/payload design, N+1 and DataLoader batching, cost limits, authorization placement, and deprecation."
purpose: >
  GraphQL schemas are long-lived contracts queried in shapes the server does not
  control. This skill reviews schema design and resolver behaviour together, catching
  nullability that blanks whole responses, unbounded lists, per-row resolver queries,
  and breaking changes before clients depend on them.
