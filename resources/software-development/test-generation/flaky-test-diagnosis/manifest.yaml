schema_version: "1.1"
id: flaky-test-diagnosis
name: Flaky Test Diagnosis
type: skill
description: "Reproduces intermittent test failures under repetition, classifies the cause (timing, order, shared state, time, randomness, environment), fixes it, or quarantines with an owner."
purpose: >
  Rerunning until green hides real defects and erodes trust in CI. This skill reproduces
  flakes with controlled repetition and ordering, assigns them to a cause family with
  evidence, fixes the cause rather than adding sleeps, and verifies the fix with an
  explicit residual-risk calculation.
