schema_version: "1.1"
id: unit-test-design
name: Unit Test Design
type: skill
description: "Derives unit test cases with equivalence partitioning, boundary values, and decision tables, picks the right test doubles, and writes AAA-structured tests."
purpose: >
  Tests written by mirroring the implementation miss boundaries and over-mock
  collaborators. This skill applies classic test-design techniques to choose a small,
  high-value case set from the unit's contract, decides where fakes, stubs, or mocks
  belong, and checks suite strength with mutation thinking.
