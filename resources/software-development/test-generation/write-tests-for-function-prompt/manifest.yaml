schema_version: "1.1"
id: write-tests-for-function-prompt
name: Write Tests for a Function
type: prompt
description: "Generates a thorough, runnable test suite for one function in a named framework, derived from equivalence classes, boundaries, error paths and properties, with a coverage rationale."
purpose: >
  Asking a model to write tests usually yields happy-path assertions that restate the
  implementation. This prompt makes the model first derive the function's contract,
  enumerate partitions and boundaries, decide on test doubles, and only then write
  idiomatic tests in the requested framework, flagging behaviour that looks like a bug
  rather than encoding it.
