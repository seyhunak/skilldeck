schema_version: "1.1"
id: explain-unfamiliar-code-prompt
name: Explain Unfamiliar Code
type: prompt
description: "Explains a pasted code excerpt in layers: one-line summary, walkthrough, data and control flow, non-obvious behaviour, risks, and open questions, calibrated to the reader's experience."
purpose: >
  Reading someone else's code is slow when explanations either stay at the surface or
  drown the reader in line-by-line narration. This prompt forces a layered explanation
  that starts with intent, then mechanics, then the subtle parts (side effects, error
  paths, concurrency, idioms), and separates what the code shows from what the model is
  guessing about its surroundings.
