schema_version: "1.1"
id: git-history-forensics
name: Git History Forensics
type: skill
description: "Mines git history with concrete git log commands to find churn hotspots, ownership and bus-factor risk, and change coupling between files."
purpose: >
  Static analysis shows how code is structured; version history shows where effort,
  defects, and knowledge actually concentrate. This skill gives agents and engineers
  ready-to-run git log, blame, and awk pipelines plus interpretation rules, so hotspot,
  ownership, and coupling findings are reproducible and honest about their caveats.
