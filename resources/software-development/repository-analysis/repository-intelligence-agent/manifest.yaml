schema_version: "1.1"
id: repository-intelligence-agent
name: Repository Intelligence Agent
type: agent
description: Maps an unfamiliar code repository and produces an evidence-backed brief on its architecture, entry points, data flow, build system, risks, and where to start.
purpose: >
  Engineers joining a project, reviewing an acquisition target, or planning a change
  waste days reverse-engineering a codebase. This agent performs a systematic,
  read-only survey and returns a navigable brief where every claim cites a file path,
  so the reader can verify it and act on it.
version: 1.0.0
author:
  name: Seyhun Akyürek
  github: seyhunak
license: MIT
domain: software-development
use_cases: [repository-analysis, architecture-assessment, documentation]
tags: [codebase, architecture, onboarding, code-analysis, documentation]
created: "2026-11-09"
updated: "2026-11-09"
content:
  entrypoint: agent.md
  files: [references/survey-checklist.md]
compatibility:
  - {platform: claude-code, level: native_install, resource_types: [agent]}
  - {platform: codex, level: file_export, resource_types: [agent]}
  - {platform: claude-desktop, level: copy_paste, resource_types: [agent]}
  - {platform: generic, level: generic_export, resource_types: [agent]}
dependencies: [git-history-forensics]
related: [architecture-review-agent, technical-debt-assessment-agent, new-codebase-onboarding-routine, explain-unfamiliar-code-prompt, code-complexity-analysis]
featured: true
safety:
  contains_scripts: false
  network_access: false
  handles_sensitive_data: true
  notes: Read-only. Never prints secret values found in the repository; reports their location and type only.
status: approved
tested: true
tested_with: [claude-code]
changelog: ["1.0.0: Initial release."]
