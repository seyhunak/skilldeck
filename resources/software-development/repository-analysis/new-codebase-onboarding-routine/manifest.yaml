id: new-codebase-onboarding-routine
name: New Codebase Onboarding Routine
type: routine
description: "A first-week plan for a developer joining an unfamiliar repository: get it running, map the architecture, trace one request end to end, ship a small change, and record what was learned."
purpose: >
  New developers often spend a week reading code without forming a working model. This
  routine sequences the first five days around concrete milestones — a local build, an
  architecture sketch verified with a teammate, a traced request, a merged small change
  — and produces onboarding notes that improve the docs for the next person.
