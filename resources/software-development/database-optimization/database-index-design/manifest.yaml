schema_version: "1.1"
id: database-index-design
name: Database Index Design
type: skill
description: "Designs indexes from the real query workload: composite ordering by equality-sort-range, covering and INCLUDE columns, partial and expression indexes, redundancy removal, and write cost."
purpose: >
  Indexes are added one query at a time until writes slow and storage balloons. This
  skill groups queries by access pattern, designs the smallest index set that serves
  them, removes redundant or unused indexes with evidence, and plans online creation so
  production is not blocked.
