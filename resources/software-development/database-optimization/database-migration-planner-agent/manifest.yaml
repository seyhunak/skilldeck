schema_version: "1.1"
id: database-migration-planner-agent
name: Database Migration Planner
type: agent
description: Plans zero-downtime relational schema changes using expand/contract phases, lock-aware DDL, batched backfills, dual-write or read-switch steps, and a rollback point for every phase, coordinated with application deploys.
purpose: >
  Schema changes are a leading cause of self-inflicted outages: a rewrite of a large
  table, a lock queued behind a long transaction, or a column dropped while old code
  still reads it. This agent turns a desired schema change into an ordered
  expand/contract plan that keeps old and new application versions working at every
  step, states the lock each statement takes, sizes backfills, and defines what to
  verify and how to roll back before moving on.
version: 1.0.0
author:
  name: Seyhun Akyürek
  github: seyhunak
license: MIT
domain: software-development
use_cases: [database-optimization, release-management]
