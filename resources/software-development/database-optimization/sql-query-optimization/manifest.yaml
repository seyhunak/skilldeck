schema_version: "1.1"
id: sql-query-optimization
name: SQL Query Optimization
type: skill
description: "Reads EXPLAIN/EXPLAIN ANALYZE plans, fixes non-sargable predicates, misestimates, deep OFFSET pagination, and N+1 patterns, and verifies rewrites by measurement."
purpose: >
  Slow queries are usually caused by a few recognisable plan problems. This skill works
  from the actual execution plan to a root cause, an equivalent rewrite, and a measured
  before/after comparison, while keeping EXPLAIN ANALYZE on write statements inside
  rolled-back transactions on non-production copies.
