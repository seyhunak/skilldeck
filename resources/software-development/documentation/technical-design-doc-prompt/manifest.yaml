schema_version: "1.1"
id: technical-design-doc-prompt
name: Technical Design Doc
type: prompt
description: "Drafts a technical design doc from a problem statement and constraints: context, goals, non-goals, proposed design, alternatives with trade-offs, risks, rollout and open questions."
purpose: >
  Design docs exist to surface disagreement before code is written, but drafts often
  skip non-goals, present a single option, or hide uncertainty. This prompt produces a
  reviewable first draft with explicit goals and non-goals, at least two genuine
  alternatives, a trade-off table, rollout and rollback plan, and a list of open
  questions, with every assumption marked for the author to confirm.
