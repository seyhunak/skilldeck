schema_version: "1.1"
id: readme-authoring
name: README Authoring
type: skill
description: "Writes READMEs with a clear pitch, a quickstart verified from a clean environment, task-oriented usage, configuration tables, honest badges, and troubleshooting from real failures."
purpose: >
  Most READMEs fail newcomers because the quickstart does not work or omits a
  prerequisite. This skill derives every command from manifests and CI, verifies the
  quickstart in a clean environment or marks it unverified, and organises the rest so
  readers can decide fast and go deeper when needed.
