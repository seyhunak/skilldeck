schema_version: "1.1"
id: commit-message-writing
name: Commit Message Writing
type: skill
description: "Writes Conventional Commits messages that explain why, not what, and splits mixed working-tree changes into atomic commits that build on their own."
purpose: >
  Commit history is read by reviewers, bisect, blame, and release automation. This skill
  produces subjects and bodies that state motivation and trade-offs, uses BREAKING
  CHANGE footers correctly so version bumps are right, and plans hunk-level splits so
  each commit is reviewable.
