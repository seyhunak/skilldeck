schema_version: "1.1"
id: legacy-modernization-agent
name: Legacy Code Modernization Agent
type: agent
description: Plans incremental modernization of a legacy system using the strangler fig pattern - maps seams and dependencies, chooses slices, designs routing and data migration, and returns a phased roadmap with rollback points.
purpose: >
  Big-bang rewrites of legacy systems routinely overrun and fail to reach parity.
  This agent plans the alternative: replacing a legacy system slice by slice while it
  keeps running. It maps the current system's capabilities, seams, and data
  ownership, picks the first slices by value and risk, designs the interception layer
  and data synchronization, and produces a phased roadmap where every phase ships to
  production, has a parity check, and can be rolled back.
