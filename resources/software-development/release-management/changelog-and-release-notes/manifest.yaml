schema_version: "1.1"
id: changelog-and-release-notes
name: Changelog and Release Notes
type: skill
description: "Builds Keep a Changelog entries from merged changes, decides the SemVer bump from breaking-change analysis, and writes user-facing release notes with upgrade steps."
purpose: >
  Changelogs written from raw commit subjects are noisy and often mislabel breaking
  changes. This skill classifies changes against the project's public surface, picks the
  version number with a stated justification, and produces both a precise CHANGELOG
  entry and readable release notes for the intended audience.
