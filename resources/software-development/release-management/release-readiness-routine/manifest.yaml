schema_version: "1.1"
id: release-readiness-routine
name: Release Readiness Routine
type: routine
description: "Runs a go/no-go review before shipping a release: scope freeze, quality gates, migrations, rollback, observability, communications, and a recorded decision with named owners."
purpose: >
  Releases fail less from bad code than from unasked questions: can we roll back, is the
  migration reversible, who is watching the dashboards. This routine walks the release
  owner through evidence-based gates, classifies each as pass, waived or fail, and ends
  with a documented go, conditional go, or no-go decision approved by named people.
