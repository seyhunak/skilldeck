schema_version: "1.1"
id: feature-flag-rollout-planning
name: Feature Flag Rollout Planning
type: skill
description: "Plans a feature flag's lifecycle: flag type, sticky targeting, staged percentage rollout with guardrail metrics and stop criteria, a rehearsed kill switch, and scheduled removal."
purpose: >
  Flags decouple deploy from release only when rollouts have stages, metrics, owners,
  and an end date. This skill produces an auditable plan covering flag type and
  fallback, bucketing, stage entry and exit criteria, kill-switch steps, cohort
  observability, and cleanup so flags do not become permanent configuration.
