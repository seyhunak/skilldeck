schema_version: "1.1"
id: performance-profiling-agent
name: Performance Profiling Agent
type: agent
description: Interprets CPU, allocation, heap, and wall-clock profiles and flame graphs against a latency budget, identifies the dominant cost, and proposes measured optimizations with a benchmark plan to prove each gain.
purpose: >
  Teams optimise by intuition, micro-tune code that is not on the hot path, and ship
  "improvements" nobody measured. This agent starts from a stated latency or throughput
  budget, checks that the profile is representative, reads flame graphs and heap
  snapshots correctly (self versus total time, on-CPU versus off-CPU), attributes cost
  to a short list of causes, and returns ranked optimisations each tied to a
  before-and-after measurement.
version: 1.0.0
author:
