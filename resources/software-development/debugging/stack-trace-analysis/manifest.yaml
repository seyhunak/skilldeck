schema_version: "1.1"
id: stack-trace-analysis
name: Stack Trace Analysis
type: skill
description: "Reads stack traces and crash reports across major languages, follows chained causes to the root, recognises common failure signatures, and symbolicates native or minified frames."
purpose: >
  Traces are precise but easy to misread: frame order differs by language, the real
  cause hides in chained exceptions, and native or minified traces need symbols. This
  skill locates the failing and originating frames and turns them into a falsifiable
  hypothesis with a way to confirm it.
