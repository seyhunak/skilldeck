schema_version: "1.1"
id: incident-postmortem-routine
name: Incident Postmortem Routine
type: routine
description: "Facilitates a blameless postmortem after an incident: evidence gathering, timeline, impact, contributing factors, what went well, and owned, verifiable action items."
purpose: >
  Postmortems that hunt for a culprit or stop at 'human error' teach nothing and repeat
  the incident. This routine structures a blameless review from raw evidence to a
  reconstructed timeline, a multi-factor causal analysis, and a short list of
  prioritized action items with owners and due dates, then sets a follow-up so the
  actions actually close.
