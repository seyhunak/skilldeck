schema_version: "1.1"
id: concurrency-bug-analysis-agent
name: Concurrency Bug Analysis Agent
type: agent
description: Analyses suspected data races, deadlocks, livelocks, async ordering bugs, and actor or thread isolation violations from code, thread dumps, and failure reports, and returns the interleaving that breaks, a fix, and a way to reproduce it deterministically.
purpose: >
  Concurrency bugs are intermittent, vanish under the debugger, and get "fixed" with
  sleeps and retries that hide them. This agent reasons explicitly about shared state,
  happens-before relationships, lock order, and await points, constructs the specific
  interleaving that produces the observed failure, and proposes fixes that remove the
  race rather than narrow its window, along with stress tests and tool settings that
  make the bug reproducible.
version: 1.0.0
author:
  name: Seyhun Akyürek
  github: seyhunak
license: MIT
domain: software-development
use_cases: [debugging]
tags: [concurrency, race-conditions, deadlocks, async, multithreading, debugging]
created: "2026-11-09"
updated: "2026-11-09"
content:
