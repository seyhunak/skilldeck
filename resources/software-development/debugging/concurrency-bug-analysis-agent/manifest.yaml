  files: [references/concurrency-patterns.md]
compatibility:
  - {platform: claude-code, level: native_install, resource_types: [agent]}
  - {platform: codex, level: file_export, resource_types: [agent]}
  - {platform: claude-desktop, level: copy_paste, resource_types: [agent]}
  - {platform: generic, level: generic_export, resource_types: [agent]}
dependencies: [stack-trace-analysis]
related: [flaky-test-diagnosis, production-incident-debugger-agent, performance-profiling-agent, unit-test-design, database-performance-agent]
featured: false
safety:
