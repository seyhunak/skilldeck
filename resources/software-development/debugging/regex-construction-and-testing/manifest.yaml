schema_version: "1.1"
id: regex-construction-and-testing
name: Regex Construction and Testing
type: skill
description: "Builds and explains engine-specific regular expressions from a positive and negative test table, with correct anchoring and checks for catastrophic backtracking (ReDoS)."
purpose: >
  Regexes break by matching the wrong things or by hanging on adversarial input. This
  skill writes test cases before the pattern, targets a named engine's syntax and
  semantics, tests in the real language, and analyses nested or overlapping quantifiers
  for backtracking risk, recommending parsers when a regex is the wrong tool.
