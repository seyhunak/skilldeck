schema_version: "1.1"
id: debug-error-message-prompt
name: Debug an Error Message
type: prompt
description: "Triages an error message, stack trace and surrounding context into a ranked list of hypotheses, each with evidence, a cheap discriminating check, and a likely fix."
purpose: >
  Developers waste time when they jump to the first plausible fix for an error. This
  prompt applies a hypothesis-driven triage: classify the error, locate the first in-
  house frame, list competing explanations ranked by likelihood and cost to test, and
  propose the smallest check that separates them, so the next ten minutes of debugging
  are spent well.
