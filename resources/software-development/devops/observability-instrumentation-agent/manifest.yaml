schema_version: "1.1"
id: observability-instrumentation-agent
name: Observability Instrumentation Agent
type: agent
description: Designs the instrumentation for a service — SLIs and SLOs with error budgets, burn-rate alerts, OpenTelemetry traces, metrics with bounded cardinality, structured logs — and returns a code-level instrumentation plan and gap analysis.
purpose: >
  Most services are either blind or drowning: no signal for the user journeys that
  matter, or thousands of unbounded-cardinality metrics and noisy alerts nobody trusts.
  This agent starts from user journeys, defines SLIs and SLOs that reflect user
  experience, then specifies which spans, metrics, and log fields to emit with
  OpenTelemetry conventions, how to keep cost and cardinality bounded, and which
  alerts page a human versus open a ticket.
version: 1.0.0
author:
