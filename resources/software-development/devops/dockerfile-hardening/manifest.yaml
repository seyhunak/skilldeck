schema_version: "1.1"
id: dockerfile-hardening
name: Dockerfile Hardening
type: skill
description: "Hardens Dockerfiles with multi-stage builds, digest-pinned bases, non-root users, minimal runtimes, BuildKit secrets, cache-friendly layers, and .dockerignore."
purpose: >
  Default container images ship build tools, run as root, and sometimes leak secrets
  into layers. This skill applies a short list of high-value controls, explains each
  trade-off (such as losing a shell in distroless images), and verifies results with
  image history, user checks, and a vulnerability scan.
