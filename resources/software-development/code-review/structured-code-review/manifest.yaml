schema_version: "1.1"
id: structured-code-review
name: Structured Code Review
type: skill
description: "Checklist-driven review of a diff with fixed severity levels (blocker to nit) and a comment format that is specific, actionable, and kind."
purpose: >
  Ad-hoc reviews over-index on style and miss correctness, security, and data risks.
  This skill fixes the order of attention, defines severities so verdicts are consistent
  across reviewers, and requires every serious finding to be verified and paired with a
  concrete suggestion.
