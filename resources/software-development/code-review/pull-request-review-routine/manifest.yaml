schema_version: "1.1"
id: pull-request-review-routine
name: Pull Request Review Routine
type: routine
description: "A reviewer's workflow for one pull request: establish context, check size and scope, review in risk order, verify tests, write labelled comments, and make an explicit approve or request-changes call."
purpose: >
  Ad-hoc reviews skim the diff top to bottom and miss what matters: whether the change
  does the right thing, its riskiest paths, and its tests. This routine gives reviewers
  a repeatable order of operations with time boxes and decision rules, so reviews are
  faster, more consistent, and end in a clear, justified decision.
