schema_version: "1.1"
id: code-review-feedback-prompt
name: Code Review Feedback
type: prompt
description: "Turns rough reviewer notes on a diff into kind, specific, actionable review comments labelled by severity, each with reasoning and a concrete suggestion."
purpose: >
  Terse or vague review comments create friction and slow merges. This prompt rewrites a
  reviewer's raw notes into comments that name the location, explain the concern and its
  impact, propose a fix, and state whether it blocks the merge, using a consistent label
  scheme so authors can triage quickly. It changes the wording, never the technical
  substance.
version: 1.0.0
author:
  name: Seyhun Akyürek
  github: seyhunak
license: MIT
domain: software-development
use_cases: [code-review]
tags: [code-review, feedback, communication, pull-requests]
