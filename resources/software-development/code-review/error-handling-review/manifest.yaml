schema_version: "1.1"
id: error-handling-review
name: Error Handling Review
type: skill
description: "Audits failure paths: swallowed exceptions, lost error context, missing timeouts, unsafe retries, cleanup on partial failure, and leaky user-facing errors."
purpose: >
  Many outages trace back to how code fails rather than how it succeeds. This skill
  inventories every failure point, checks timeouts, retry safety, context preservation,
  cleanup, and what users and operators see, and ranks findings by consequence with
  corrected code for the worst ones.
