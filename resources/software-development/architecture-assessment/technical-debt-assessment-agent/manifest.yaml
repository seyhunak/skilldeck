schema_version: "1.1"
id: technical-debt-assessment-agent
name: Technical Debt Assessment Agent
type: agent
description: Catalogues technical debt in a codebase, estimates principal (cost to fix) and interest (ongoing cost of not fixing) from evidence such as churn and incidents, and returns a prioritized debt register.
purpose: >
  "We have a lot of tech debt" is not a plan, and debt lists sorted by how much
  engineers dislike the code rarely win budget. This agent finds debt with evidence,
  separates principal from interest, uses change frequency and incident history to
  estimate where interest is actually being paid, and classifies each item with the
  technical debt quadrant. The result is a register ranked by return on paydown that
  engineering leads can defend to product and finance stakeholders.
