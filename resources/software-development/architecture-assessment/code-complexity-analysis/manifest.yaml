schema_version: "1.1"
id: code-complexity-analysis
name: Code Complexity Analysis
type: skill
description: "Measures cyclomatic and cognitive complexity, nesting, and coupling metrics (Ca, Ce, instability, abstractness, cycles) and turns them into prioritised refactoring targets."
purpose: >
  Raw complexity numbers mislead without context. This skill measures function and
  module metrics with established tools, combines them with churn and test coverage to
  rank what is worth changing, maps each hotspot pattern to a specific refactoring, and
  proposes ratcheting CI gates instead of big-bang thresholds.
