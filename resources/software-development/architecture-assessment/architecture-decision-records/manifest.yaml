schema_version: "1.1"
id: architecture-decision-records
name: Architecture Decision Records
type: skill
description: "Writes MADR or Nygard-style ADRs with neutral context, decision drivers, real options with pros and cons, consequences, and a proposed-accepted-superseded lifecycle."
purpose: >
  The reasoning behind hard-to-reverse technical choices is lost when people move on.
  This skill records one decision per ADR, presents alternatives fairly, states negative
  consequences openly, and keeps history intact by superseding rather than editing
  accepted decisions.
