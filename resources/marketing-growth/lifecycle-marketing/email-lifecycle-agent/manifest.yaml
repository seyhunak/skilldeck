schema_version: "1.1"
id: email-lifecycle-agent
name: Email Lifecycle Agent
type: agent
description: "Designs lifecycle email programs (onboarding, activation, retention, win-back) with triggers, timing, segmentation, exit rules, copy drafts, and a measurement plan per flow."
purpose: >
  Lifecycle programs decay into a pile of unconnected sends. This agent maps the customer
  lifecycle to behavioural triggers, designs flows with entry, exit, and suppression
  rules, drafts the copy for each message, and defines holdout-based measurement so the
  team can tell which flows actually change activation, retention, and reactivation.
