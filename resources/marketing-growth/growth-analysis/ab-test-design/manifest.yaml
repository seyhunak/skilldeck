schema_version: "1.1"
id: ab-test-design
name: A/B Test Design
type: skill
description: "Designs marketing A/B tests: hypothesis, primary and guardrail metrics, minimum detectable effect, sample size and duration, randomization unit, and stopping rules. Use before launching any test."
purpose: >
  Most failed marketing tests were doomed at design time: underpowered, peeked at, or
  measured on the wrong metric. This skill gives an agent a pre-registration procedure
  that forces a falsifiable hypothesis, a single decision metric with guardrails, a power
  calculation, and explicit stopping and decision rules before any traffic is spent.
