schema_version: "1.1"
id: customer-segmentation
name: Customer Segmentation
type: skill
description: "Segments customers with RFM scoring, behavioral clustering, or needs-based research and turns segments into actionable profiles. Use for targeting, lifecycle programs, or prioritizing markets."
purpose: >
  Segments are only useful if they are stable, sizeable, distinguishable, and actionable.
  This skill helps an agent choose the right segmentation approach for the question, run
  RFM or behavioural segmentation on exported data with clear thresholds, validate
  segments, and describe each one with the action it implies.
