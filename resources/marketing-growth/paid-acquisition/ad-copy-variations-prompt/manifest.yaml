schema_version: "1.1"
id: ad-copy-variations-prompt
name: Ad Copy Variations
type: prompt
description: "Generates structured ad copy variations for search and social platforms within user-supplied character limits and policy notes, each tagged with its angle and checked for length."
purpose: >
  Ad testing needs variants that differ by angle, not by synonym. This prompt produces
  deliberately differentiated variations across benefit, proof, objection, and urgency
  angles, enforces the character limits the user supplies, and flags claims that platform
  policies commonly restrict, with a reminder to confirm current rules.
