schema_version: "1.1"
id: social-media-strategy-agent
name: Social Media Strategy Agent
type: agent
description: "Builds an organic social media strategy: channel selection by audience fit, content pillars and mix, posting cadence, community management rules, and a measurement plan."
purpose: >
  Brands spread thin across every network with the same post. This agent chooses channels
  based on where the audience actually is and what the team can sustain, defines content
  pillars and format mix per channel, sets a realistic cadence, and specifies the metrics
  that indicate real progress rather than vanity engagement.
