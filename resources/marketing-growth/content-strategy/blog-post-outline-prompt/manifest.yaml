schema_version: "1.1"
id: blog-post-outline-prompt
name: Blog Post Outline
type: prompt
description: "Produces a search-intent-aligned blog post outline with H2/H3 structure, the question each section answers, evidence needed, and internal link slots from a target query and SERP notes."
purpose: >
  A good outline decides most of a post's quality. This prompt makes the model classify
  intent, match the format the results page rewards, find the gap competitors leave, and
  structure sections around reader questions, with evidence placeholders instead of
  invented facts.
version: 1.0.0
author:
  name: Seyhun Akyürek
  github: seyhunak
license: MIT
domain: marketing-growth
use_cases: [content-strategy, seo-auditing]
