schema_version: "1.1"
id: content-brief-creation
name: Content Brief Creation
type: skill
description: "Creates SEO-informed writer briefs: target query and intent, reader, angle, SERP analysis, required subtopics, outline, sources, internal links, and acceptance criteria. Use before commissioning content."
purpose: >
  Writers given only a keyword produce generic content. This skill turns a target query
  into a brief that tells the writer who the reader is, what the results page already
  covers, what the piece must add, how it should be structured and sourced, and how the
  editor will judge it.
