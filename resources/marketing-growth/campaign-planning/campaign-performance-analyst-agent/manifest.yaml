schema_version: "1.1"
id: campaign-performance-analyst-agent
name: Campaign Performance Analyst
type: agent
description: "Analyzes multi-channel campaign results against goals: normalizes spend and conversion data, compares channels on consistent metrics, flags attribution caveats, and recommends budget shifts."
purpose: >
  Channel dashboards each tell a flattering story in their own metrics. This agent
  reconciles exports from ad platforms, analytics, and CRM into one comparable view,
  checks the numbers against the campaign's original goals, separates platform-reported
  from observed outcomes, and returns a readout with clear findings, confidence levels,
  and recommended actions for the next flight.
