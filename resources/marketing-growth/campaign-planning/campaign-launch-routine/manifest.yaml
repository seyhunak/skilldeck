schema_version: "1.1"
id: campaign-launch-routine
name: Campaign Launch Routine
type: routine
description: "A human-supervised pre-launch, launch-day, and first-week routine for marketing campaigns: brief sign-off, tracking QA, asset and policy checks, staged go-live, and early monitoring."
purpose: >
  Campaigns lose money in their first days to broken tracking, wrong audiences, mismatched
  landing pages, and unapproved claims. This routine sequences the checks that prevent
  those failures, defines who approves each gate, and sets early-warning thresholds so
  problems are caught before the budget is spent.
