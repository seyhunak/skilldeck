schema_version: "1.1"
id: marketing-attribution-analysis
name: Marketing Attribution Analysis
type: skill
description: "Compares attribution models (last-click, first-touch, position-based, data-driven) on campaign data, explains where they disagree, and states incrementality caveats. Use when allocating budget across channels."
purpose: >
  Attribution models assign credit; they do not measure causation. This skill helps an
  agent compute and compare rule-based models on path data, interpret the differences,
  triangulate with platform-reported and incrementality evidence, and present budget
  implications with honest confidence levels.
