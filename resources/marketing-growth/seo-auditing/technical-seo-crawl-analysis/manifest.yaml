schema_version: "1.1"
id: technical-seo-crawl-analysis
name: Technical SEO Crawl Analysis
type: skill
description: "Interprets site crawler exports (status codes, indexability, canonicals, redirects, duplicates, depth, sitemaps, hreflang) to find and size technical SEO problems. Use after running a crawl."
purpose: >
  Crawler exports list thousands of issues with no sense of scale or cause. This skill
  teaches an agent to load the right export tabs, segment URLs by template, cross-check
  indexability signals against each other, trace issues to their root template or rule,
  and rank them by the number of important URLs affected.
