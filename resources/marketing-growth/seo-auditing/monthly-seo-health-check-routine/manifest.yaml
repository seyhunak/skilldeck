schema_version: "1.1"
id: monthly-seo-health-check-routine
name: Monthly SEO Health Check Routine
type: routine
description: "A monthly, human-run checklist to review organic performance, indexing coverage, crawl health, Core Web Vitals, and top-page changes, ending in a short dated issue log and fix tickets."
purpose: >
  SEO regressions usually come from releases nobody connected to search: a noindex on a
  template, a broken redirect map, a slow new component. A fixed monthly review of the
  same data sources, compared month over month, catches them while they are cheap to fix
  and creates a historical record.
