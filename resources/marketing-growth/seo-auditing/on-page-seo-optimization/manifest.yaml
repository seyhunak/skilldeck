schema_version: "1.1"
id: on-page-seo-optimization
name: On-Page SEO Optimization
type: skill
description: "Optimizes a single page's on-page SEO elements: title tag, meta description, heading outline, body coverage, internal links, images, and structured data. Use when improving or launching a page."
purpose: >
  On-page SEO advice is often a checklist of character counts. This skill teaches an agent
  to start from the page's target query and intent, fix the elements that influence
  relevance and clicks, add internal links that pass context, and propose valid structured
  data, returning concrete before/after recommendations for one page.
