schema_version: "1.1"
id: seo-audit-agent
name: SEO Audit Agent
type: agent
description: "Audits a website across technical SEO, on-page, content quality, and links, then returns an evidence-backed findings register with an impact-by-effort prioritized fix plan."
purpose: >
  Most SEO audits are tool exports with hundreds of undifferentiated warnings. This agent
  works through crawl data, Search Console exports, and page samples the way a senior SEO
  consultant would: it confirms each issue against evidence, estimates how many URLs and
  how much traffic it affects, separates indexation blockers from cosmetic warnings, and
  hands back a short, sequenced fix plan that engineering and content teams can actually
  ship.
version: 1.0.0
author:
  name: Seyhun Akyürek
  github: seyhunak
license: MIT
