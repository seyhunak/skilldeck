schema_version: "1.1"
id: keyword-research
name: Keyword Research
type: skill
description: "Turns seed topics and keyword tool exports into intent-classified, clustered, and prioritized keyword sets. Use when planning SEO content, mapping keywords to pages, or sizing search demand."
purpose: >
  Raw keyword exports are long, noisy lists. This skill gives an agent a repeatable method
  to expand seeds, classify search intent from the results page, cluster by shared ranking
  URLs, judge realistic difficulty for the specific site, and prioritize clusters by
  business value, so the output is a short keyword-to-page map rather than a spreadsheet
  dump.
