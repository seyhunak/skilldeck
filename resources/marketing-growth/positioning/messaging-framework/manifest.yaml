schema_version: "1.1"
id: messaging-framework
name: Messaging Framework
type: skill
description: "Builds a messaging house from positioning: umbrella message, three supporting pillars, proof points per pillar, and audience-specific variants. Use when aligning teams on what to say."
purpose: >
  Without a shared messaging framework, every team describes the product differently. This
  skill converts positioning into a messaging house with a single umbrella statement,
  pillars that each map to a customer value, proof points rated by strength, and variants
  per audience, so copywriters, sales, and product all draw from the same source.
