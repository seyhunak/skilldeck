schema_version: "1.1"
id: product-marketing-positioning-agent
name: Product Marketing Positioning Agent
type: agent
description: "Develops product positioning using April Dunford's component method: competitive alternatives, unique attributes, value, target customers, and market category, with evidence and risks."
purpose: >
  Weak positioning makes every downstream asset vague. This agent runs a structured
  positioning exercise from the customer's real alternatives outward, ties each claimed
  attribute to evidence, identifies the customers who care most, chooses a market frame
  that makes the value obvious, and returns a positioning canvas the team can test and
  build messaging on.
