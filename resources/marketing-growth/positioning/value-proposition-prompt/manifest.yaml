schema_version: "1.1"
id: value-proposition-prompt
name: Value Proposition
type: prompt
description: "Fills a value proposition canvas (customer jobs, pains, gains vs. pain relievers and gain creators) from research notes and turns the strongest fits into candidate value proposition statements."
purpose: >
  Value propositions written from the product outward sound like feature lists. This
  prompt forces the model to start from the customer profile, map product capabilities to
  specific jobs, pains, and gains, score fit, and only then draft statements in several
  formats, each traceable to the canvas.
