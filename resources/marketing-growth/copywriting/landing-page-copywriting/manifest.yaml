schema_version: "1.1"
id: landing-page-copywriting
name: Landing Page Copywriting
type: skill
description: "Writes and restructures landing page copy: section structure by awareness level, headline formulas, benefit-led body, proof placement, objection handling, and CTA. Use for new pages or rewrites."
purpose: >
  Landing pages fail when they lead with features, bury proof, or ask for commitment
  before earning it. This skill gives an agent a structure keyed to visitor awareness and
  traffic source, headline formulas to generate options, rules for placing evidence where
  doubt arises, and a review pass that removes unsupported claims.
