schema_version: "1.1"
id: brand-voice-guardian-agent
name: Brand Voice Guardian
type: agent
description: "Checks marketing and product copy against a brand voice guide, scores each piece on defined voice attributes, and returns line-level edits with the rule each edit enforces."
purpose: >
  Voice guides sit unread while copy drifts across writers, agencies, and AI drafts. This
  agent turns a voice guide into testable rules, reviews copy line by line against them,
  distinguishes hard violations from judgement calls, and returns tracked edits that keep
  the writer's meaning, so editors get consistent, explainable feedback instead of taste-
  based rewrites.
