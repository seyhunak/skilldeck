name: Validate submission

# Runs on every pull request. Read-only: contributor content is parsed as data,
# never executed, and no secrets are available to this workflow.
on:
  pull_request:
    paths:
      - "resources/**"
      - "contributors/**"
      - "catalog/**"
      - "schemas/**"
      - "scripts/**"
      - "templates/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/validate-submission.yml"

permissions:
  contents: read

concurrency:
  group: validate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate catalog changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Detect changed resources
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git diff --name-only "origin/${BASE_REF}...HEAD" > changed.txt
          echo "Changed files:"; cat changed.txt
      - name: Validate (changed packages + catalog-wide checks)
        run: python scripts/validate_catalog.py --changed-files changed.txt --report validation-report.md
      - name: Publish validation report
        if: always()
        run: test -f validation-report.md && cat validation-report.md >> "$GITHUB_STEP_SUMMARY" || true
      - name: Tooling tests
        run: python -m unittest discover -s tests -v
      - name: Launch gate
        run: python scripts/check_launch_catalog.py
      - name: Test catalog build
        run: python scripts/build_catalog.py --out "$RUNNER_TEMP/dist"
