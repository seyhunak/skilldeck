name: macOS app

# Builds and tests the native app. Read-only; no secrets.
on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/macos-app.yml"
  pull_request:
    paths:
      - "app/**"
      - ".github/workflows/macos-app.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Test SkilldeckCore and build Skilldeck.app
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Show toolchain
        run: xcodebuild -version && swift --version
      - name: Swift tests
        working-directory: app
        run: swift test
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        working-directory: app
        run: xcodegen generate
      - name: Build app (Release, ad-hoc signed)
        working-directory: app
        run: xcodebuild -project Skilldeck.xcodeproj -scheme Skilldeck -configuration Release -derivedDataPath build/DerivedData build
      - name: Package app
        working-directory: app/build/DerivedData/Build/Products/Release
        run: ditto -c -k --keepParent Skilldeck.app "$RUNNER_TEMP/Skilldeck.zip"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Skilldeck-app
          path: ${{ runner.temp }}/Skilldeck.zip
          retention-days: 14
