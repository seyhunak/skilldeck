name: Release catalog

# Publishes a versioned catalog release when catalog/catalog.yaml's
# catalog_version has no release yet. Also refreshes the rolling
# `catalog-latest` release whose latest.json the macOS app polls.
on:
  push:
    branches: [main]
    paths:
      - "resources/**"
      - "contributors/**"
      - "catalog/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-catalog
  cancel-in-progress: false

jobs:
  release:
    name: Publish catalog release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write   # create releases and upload assets; nothing else
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Read catalog version
        id: meta
        run: |
          VERSION=$(python -c "import yaml;print(yaml.safe_load(open('catalog/catalog.yaml'))['catalog_version'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Gate on validation and launch requirements
        run: |
          python scripts/validate_catalog.py --quiet
          python scripts/check_launch_catalog.py
      - name: Fetch previous release index
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release download catalog-latest --repo "$GITHUB_REPOSITORY" --pattern latest.json --dir prev 2>/dev/null; then
            URL=$(python -c "import json;print(json.load(open('prev/latest.json'))['index']['url'])")
            curl -fsSL "$URL" -o prev/catalog.json || true
          fi
      - name: Build catalog
        run: |
          export SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          ARGS=""
          [ -f prev/catalog.json ] && ARGS="--previous prev/catalog.json"
          python scripts/build_catalog.py $ARGS
          python scripts/quality_report.py --out dist/quality-report.md
      - name: Check version bump
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          if gh release view "catalog-v${VERSION}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            CHANGED=$(python -c "import json;c=json.load(open('dist/catalog.json'))['changes'];print(len(c['added'])+len(c['updated'])+len(c['removed']))")
            if [ "$CHANGED" != "0" ]; then
              echo "::error::Catalog content changed but catalog-v${VERSION} already exists. Bump catalog_version in catalog/catalog.yaml."
              exit 1
            fi
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish versioned release
        if: steps.check.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          (cd dist/packages && zip -q -r -X ../packages.zip .)
          gh release create "catalog-v${VERSION}" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Skilldeck Catalog ${VERSION}" --notes-file dist/CHANGES.md \
            dist/catalog.json dist/catalog-bundle.json dist/latest.json dist/packages.zip dist/quality-report.md dist/packages/*.zip
      - name: Update rolling catalog-latest pointer
        if: steps.check.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          if ! gh release view catalog-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create catalog-latest --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
              --title "Catalog update pointer" --notes "Rolling pointer polled by the Skilldeck app. Points at catalog-v${VERSION}."
          fi
          gh release upload catalog-latest dist/latest.json --clobber --repo "$GITHUB_REPOSITORY"
